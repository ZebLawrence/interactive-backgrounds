<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fishbowl</title>
<meta name="description" content="An interactive 3D aquarium: fish school, flee a fast cursor, come to inspect a resting one, and race for food you drop in.">
<meta name="theme-color" content="#092f40">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%A0%3C/text%3E%3C/svg%3E">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #092f40; }
  body { font: 13px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; color: #e8f4f8; }
  canvas#tank { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
  #fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  #fx > * { position: absolute; mix-blend-mode: screen; mix-blend-mode: plus-lighter; pointer-events: none; }
  .fx-sky { left: 0; top: 0; width: 100%; height: 45%;
    background: linear-gradient(to bottom, rgba(89,173,191,.28) 0%, rgba(77,153,173,.10) 40%, rgba(89,166,184,0) 100%); }
  .fx-streak { top: 5%; height: 90%; background-size: 100% 100%; }
  .fx-ring { width: 120px; height: 120px; opacity: 0; }

  #ui { position: fixed; top: 12px; right: 12px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
    transition: opacity .6s; }
  #ui.idle:not(.open) { opacity: 0; }
  #menuBtn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid rgba(255,255,255,.18); cursor: pointer;
    background: rgba(8,30,40,.45); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); color: #e8f4f8;
    display: grid; place-items: center; padding: 0; }
  #menuBtn:hover { background: rgba(20,60,76,.6); }
  #menuBtn svg { width: 22px; height: 22px; }
  #menu { min-width: 236px; max-height: calc(100vh - 80px); overflow: auto; padding: 6px; border-radius: 12px;
    background: rgba(10,28,36,.72); backdrop-filter: blur(20px) saturate(1.4); -webkit-backdrop-filter: blur(20px) saturate(1.4);
    border: 1px solid rgba(255,255,255,.14); box-shadow: 0 10px 40px rgba(0,0,0,.4); }
  #menu[hidden] { display: none; }
  #menu .hdr { padding: 6px 10px 8px; color: rgba(232,244,248,.6); font-weight: 600; }
  #menu hr { border: 0; border-top: 1px solid rgba(255,255,255,.12); margin: 5px 4px; }
  #menu button { display: flex; width: 100%; align-items: center; gap: 8px; padding: 6px 10px; border: 0; border-radius: 6px;
    background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  #menu button:hover, #menu button:focus-visible { background: rgba(80,170,200,.3); outline: none; }
  #menu button .check { width: 14px; flex: none; text-align: center; }
  #menu button .label { flex: 1; }
  #menu kbd { font: inherit; color: rgba(232,244,248,.5); }
  #species { padding-left: 22px; }
  #species[hidden] { display: none; }
  #hint { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); padding: 8px 14px; border-radius: 20px;
    background: rgba(8,30,40,.5); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); color: rgba(232,244,248,.85);
    pointer-events: none; transition: opacity 1.2s; white-space: nowrap; max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis; }
  #hint.gone { opacity: 0; }
  #error { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center; }
  #error[hidden] { display: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="tank"></canvas>
<div id="fx"></div>
<div id="ui">
  <button id="menuBtn" aria-label="Fishbowl menu" aria-expanded="false" title="Fishbowl">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.2 12c2-3.3 5.2-5.3 8.9-5.3 3.4 0 6.1 1.7 7.9 4.1L22.8 8v8l-2.8-2.8c-1.8 2.4-4.5 4.1-7.9 4.1-3.7 0-6.9-2-8.9-5.3Zm12.3-1.6a1.1 1.1 0 1 0 0 2.2 1.1 1.1 0 0 0 0-2.2Z"/></svg>
  </button>
  <div id="menu" hidden role="menu">
    <div class="hdr" id="menuTitle">Fishbowl</div>
    <hr>
    <button data-act="feed"><span class="check"></span><span class="label">Feed the Fish</span><kbd>F</kbd></button>
    <button data-act="add"><span class="check">▸</span><span class="label">Add Fish</span></button>
    <div id="species" hidden></div>
    <button data-act="remove"><span class="check"></span><span class="label">Remove a Fish</span></button>
    <button data-act="refill"><span class="check"></span><span class="label">Refill Tank</span></button>
    <hr>
    <button data-toggle="nightMode"><span class="check"></span><span class="label">Night Mode</span><kbd>N</kbd></button>
    <button data-toggle="shark"><span class="check"></span><span class="label">Shark</span></button>
    <button data-toggle="clickToFeed"><span class="check"></span><span class="label">Click to Feed</span></button>
    <button data-toggle="lowPower"><span class="check"></span><span class="label">Low Power (30 fps)</span></button>
    <hr>
    <button data-act="fullscreen"><span class="check"></span><span class="label">Full Screen</span></button>
  </div>
</div>
<div id="hint">Move fast to startle the fish · rest the cursor and they come to look · click to feed</div>
<div id="error" hidden></div>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
