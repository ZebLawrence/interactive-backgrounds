      transparent: !solid,
      depthWrite: solid,
      alphaTest: solid ? 0.5 : 0,
    });
    return patchMaterial(mat, {
      key: solid ? 'fish-fins-solid' : 'fish-fins',
      uniforms: { uTime: G.uTime, ...u },
      vHead: FISH_FINS_HEAD,
      vMain: 'fishFins(gPos, gNrm);',
      fHead: solid ? '' : FIN_GLOW_HEAD,
      fMap: MAP_UNPREMULTIPLY,
      fAfterEmissive: solid ? '' : FIN_GLOW,
    });
  },

  /** Per-fish touches: a slight shift of hue, saturation and brightness for every fish, plus
   *  colour morphs for goldfish and bettas. Returns the uniform values. */
  personalize(s, skinRect) {
    let look = { hue: rnd(-0.05, 0.05), saturation: rnd(0.9, 1.1), value: rnd(0.9, 1.08), sheen: 1, pale: 0, dark: 0, speckle: 0,
      paleColor: [0.97, 0.94, 0.88] };
    switch (s.id) {
      case Species.goldfish.id: look = FishMaterials.goldfishMorph(look); break;
      case Species.betta.id: look = FishMaterials.bettaMorph(look); break;
      case Species.clownfish.id:
        // From pale tangerine to deep red-orange.
        look.hue = rnd(-0.1, 0.04);
        look.saturation = rnd(0.95, 1.15);
        look.value = rnd(0.82, 1.05);
        break;
      case Species.neonTetra.id:
        look.hue = rnd(-0.03, 0.03);
        look.value = rnd(0.94, 1.05);
        break;
      case Species.shark.id:
        look = { ...look, hue: 0, saturation: rnd(0.9, 1.1), value: rnd(0.95, 1.04) };
        break;
    }
    return {
      fishLook: new THREE.Vector4(look.hue, look.saturation, look.value, look.sheen),
      fishMorph: new THREE.Vector4(look.pale, look.dark, look.speckle, rnd(0, 50)),
      fishPale: new THREE.Vector4(...look.paleColor, skinRect.w / skinRect.h),
    };
  },

  /** Fancy goldfish come in a handful of classic colourings; plain orange is the most common. */
  goldfishMorph(l) {
    const r = Math.random();
    if (r < 0.38) { /* orange */ }
    else if (r < 0.58) { // red and white
      l.hue = rnd(-0.1, -0.05); l.saturation = rnd(1.05, 1.15); l.value = rnd(0.8, 0.9); l.pale = rnd(0.4, 0.6);
    } else if (r < 0.74) { // calico: orange, pearly blue-white and black, freckled
      l.saturation = rnd(0.8, 0.95); l.pale = rnd(0.35, 0.5); l.dark = rnd(0.3, 0.45); l.speckle = 1; l.paleColor = [0.84, 0.88, 0.92];
    } else if (r < 0.87) { // lemon
      l.hue = rnd(0.1, 0.15); l.saturation = rnd(0.85, 0.95); l.value = rnd(1.12, 1.2);
    } else if (r < 0.94) { // black and orange
      l.dark = rnd(0.45, 0.6);
    } else { // all white
      l.pale = 1; l.sheen = 1.2;
    }
    return l;
  },

  /** The painted betta is royal blue; others are turned to red, turquoise or purple. */
  bettaMorph(l) {
    switch (randInt(0, 3)) {
      case 0: break; // royal blue
      case 1: l.hue = rnd(2.55, 2.7); l.saturation = rnd(1.1, 1.25); l.sheen = 0.35; break; // red
      case 2: l.hue = rnd(-0.75, -0.6); l.value = rnd(1.0, 1.1); break; // turquoise
      default: l.hue = rnd(0.7, 0.85); l.sheen = 0.7; // purple
    }
    return l;
  },
};

// ---------------------------------------------------------------------------------------------
// The 3D model for a species (FishModel.swift), built once and shared by every fish of it
// ---------------------------------------------------------------------------------------------

/** World units per species point: 1 world unit = 100 screen points, and fish are drawn 1.3x. */
const FISH_UNIT = 1.3 / 100;

const FishModel = {
  cache: {},
  forSpecies(s) {
    return FishModel.cache[s.id] ??= FishModel.make(s);
  },

  make(s) {
    const art = FishArt.forSpecies(s);
    const u = FISH_UNIT;
    const bodyMesh = FishBody.mesh(s, art).scaled(u);
    bodyMesh.computeNormals();
    const skinTexture = Art.texture(art.skin);
    // Overlapping scales: about 24 along the body whatever the species' size.
    const scaleSize = s.length / 24;
    const scalesTexture = Detail.scales().clone();
    scalesTexture.repeat.set(art.skinRect.w / (scaleSize * 8), art.skinRect.h / (scaleSize * 0.8 * 10));
    scalesTexture.needsUpdate = true;
    const model = {
      species: s,
      art,
      length: s.length * u,
      noseX: s.length / 2 * u,
      body: bodyMesh.geometry(),
      skinTexture,
      scalesTexture,
      fins: FishFins.build(s, art, u),
      eyes: EyeModel.make(s, u),
      jaw: s.shape === 'shark'
        ? SharkJaw.make(s, u, (x) => { const c = FishBody.section(s, x); return { hy: c.bottom, hz: c.halfWidth }; })
        : null,
    };
    for (const g of [model.body, model.fins.geometry, model.eyes.geometry]) Tank.sharedGeometry.add(g);
    if (model.jaw) {
      for (const g of [model.jaw.shell, model.jaw.lowerTeeth, model.jaw.upperTeeth, model.jaw.palate]) Tank.sharedGeometry.add(g);
      model.jaw.material.userData.shared = true;
    }
    return model;
  },
};
// ---------------------------------------------------------------------------------------------
// FishRig (FishRig.swift): everything that draws and animates one fish — its nodes, its private
// materials, the swim wave sent to the shaders, its eyes and, for the shark, its jaw
// ---------------------------------------------------------------------------------------------

/** Fade a whole object (all its materials) to opacity `a`, switching to blending only while needed. */
function setObjectOpacity(obj, a) {
  obj.traverse((o) => {
    if (!o.material) return;
    const m = o.material;
    if (m.userData.baseTransparent === undefined) {
      m.userData.baseTransparent = m.transparent;
      m.userData.baseOpacity = m.opacity;
      m.userData.baseDepthWrite = m.depthWrite;
    }
    const want = m.userData.baseTransparent || a < 0.999;
    if (m.transparent !== want) { m.transparent = want; m.needsUpdate = true; }
    m.opacity = m.userData.baseOpacity * a;
  });
}

class FishRig {
  constructor(model, size) {
    this.model = model;
    this.node = new THREE.Group();
    const s = model.species;
    const shark = s.shape === 'shark';
    this.finsMove = !shark;

    // 0 = gliding, 1 = swimming normally (set by Fish each frame). Mouth: 0 shut ... 1 wide (shark).
    this.thrust = 1;
    this.mouthOpen = 0;

    // Swim rhythm as last sent to the shader: phase(t) = swimFreq * t + swimOffset.
    this.swimFreq = 0;
    this.swimOffset = rnd(0, TAU);
    this.swimAmp = 0;
    this.smoothedAmp = 0;
    this.sinceRhythmUpdate = 1;
    this.swimBend = 0;
    this.targetBend = 0;
    this.sinceBendUpdate = 1;
    this.renderTime = 0;
    this.causticScale = 1;
    // Independent fin motion: hover and brake as wanted, and as last sent.
    this.hover = 0;
    this.brake = 0;
    this.lastSpeed = 0;
    this.finFrom = new THREE.Vector2();
    this.finTo = new THREE.Vector2();
    this.finTime = -100;
    this.sinceFinUpdate = 1;
    this.glowFrom = 0;
    this.glowTo = 0;
    this.glowTime = -100;
    this.sinceGlowUpdate = 1;
    this.lampSent = false;

    const swim = {
      swimFreq: { value: 0 }, swimOffset: { value: this.swimOffset }, swimAmp: { value: 0 }, swimBend: { value: 0 },
      noseX: { value: model.noseX }, bodyLen: { value: model.length },
    };
    this.swim = swim;
    // Breathing: a slow rhythm, slower for bigger fish. The shark only flares its gill slits.
    const breathHz = (shark ? 0.3 : clamp(38 / s.length, 0.3, 1.1)) * rnd(0.85, 1.15);
    const look = FishMaterials.personalize(s, model.art.skinRect);
    this.bodyU = {
      ...swim,
      breathFreq: { value: quantize(breathHz * TAU) },
      breathPhase: { value: rnd(0, TAU) },
      mouthAmp: { value: shark ? 0 : 0.03 },
      gillAmp: { value: shark ? 0.006 : 0.03 },
      gillX: { value: shark ? 0.36 : 0.3 },
      gulpTime: { value: -1000 },
      fishLook: { value: look.fishLook },
      fishMorph: { value: look.fishMorph },
      fishPale: { value: look.fishPale },
      fishSheen: { value: new THREE.Vector4(...FishMaterials.sheen(s)) },
    };
    // Fins scull at their own pace; small fish flick them faster.
    const finHz = 110 / (s.length + 14) * rnd(0.9, 1.1);
    this.finU = {
      ...swim,
      finFreq: { value: quantize(finHz * TAU) },
      finSeed: { value: rnd(0, TAU) },
      finFrom: { value: new THREE.Vector4() },
      finTo: { value: new THREE.Vector4() },
      finTime: { value: this.finTime },
      finGlow: { value: new THREE.Vector4() },
      lampPos: { value: v3() },
    };

    const body = new THREE.Mesh(model.body, FishMaterials.body(model, this.bodyU));
    body.customDepthMaterial = FishMaterials.bodyDepth(this.bodyU);
    body.castShadow = true;
    body.receiveShadow = true;
    body.frustumCulled = false;
    const fins = new THREE.Mesh(model.fins.geometry, FishMaterials.fins(model, this.finU));
    fins.receiveShadow = true;
    fins.frustumCulled = false;
    this.node.add(body, fins);
    this.eyes = new EyeRig(model.eyes, this.node);

    if (model.jaw) {
      const jaw = model.jaw;
      const mk = (g) => new THREE.Mesh(g, jaw.material);
      const pivot = new THREE.Group();
      pivot.position.copy(jaw.hinge);
      const shell = mk(jaw.shell);
      shell.position.copy(jaw.hinge).negate();
      const lower = mk(jaw.lowerTeeth);
      lower.position.copy(jaw.hinge).negate();
      pivot.add(shell, lower);
      const upper = mk(jaw.upperTeeth);
      const roof = mk(jaw.palate);
      this.node.add(pivot, upper, roof);
      this.jawPivot = pivot;
      this.upperTeeth = upper;
      this.lowerTeeth = lower;
      this.palate = roof;
    }
    this.node.scale.setScalar(size);
  }

  /** A sudden sideways curl of the whole body, e.g. the C-shaped start of an escape. */
  curl(amount) { this.targetBend += amount * this.model.length; }

  /** The fish just ate something: the mouth gapes for a moment and the gills flare. */
  gulp() { this.bodyU.gulpTime.value = this.renderTime; }

  /** Update the animation for this frame. */
  animate(dt, fish, speed, cruise, excitement, turnRate, tank) {
    this.renderTime = tank.renderTime;
    const model = this.model;
    // Flex into the turn: the body arcs with the tail swinging toward the inside of the curve.
    const flex = model.species.flex;
    const maxBend = model.length * 0.3 * Math.min(flex, 1.5);
    const bendGoal = clamp(-turnRate * model.length * 0.12 * flex, -maxBend, maxBend);
    this.targetBend += (bendGoal - this.targetBend) * Math.min(1, dt * 6);
    this.updateBend(dt);

    // Faster, bigger tail beats at speed; the tail all but stops while gliding.
    const hz = Math.min(8, 1.1 + (speed / Fish.speedUnit) / (model.species.length * 0.9));
    const beat = 0.06 + 0.94 * clamp(this.thrust, 0, 1);
    const targetAmp = model.length * (0.035 + 0.05 * Math.min(1, speed / (cruise * 2)) + 0.03 * excitement) * beat;
    this.smoothedAmp += (targetAmp - this.smoothedAmp) * Math.min(1, dt * 3);
    this.updateSwimRhythm(hz, dt);

    // Pectorals scull hardest when hovering or gliding, and flare out to brake.
    if (this.finsMove) {
      const slow = clamp(1 - speed / cruise, 0, 1);
      this.hover += (Math.max(slow, (1 - clamp(this.thrust, 0, 1)) * 0.6) - this.hover) * Math.min(1, dt * 2);
      const decel = dt > 0 ? (this.lastSpeed - speed) / dt : 0;
      const brakeGoal = clamp((decel / cruise - 0.4) / 1.2, 0, 1);
      this.brake += (brakeGoal - this.brake) * Math.min(1, dt * (brakeGoal > this.brake ? 8 : 1.5));
      this.updateFins(dt);
      this.updateGlow(dt, fish, tank);
    }
    this.lastSpeed = speed;

    this.eyes.update(dt, fish, tank, this.lateralOffset(model.eyes.x));
    this.updateJaw();
  }

  /** Fish get no caustics at night, and their fins glow only in the lamp's beam. */
  setCausticScale(scale) {
    if (scale === this.causticScale) return;
    this.causticScale = scale;
    this.sinceGlowUpdate = Infinity;
  }

  /** Same wave as the swim shader, so rigid parts (eyes, jaw) follow the body. */
  lateralOffset(x) {
    const s = Math.max(0, (this.model.noseX - x) / this.model.length);
    const phase = this.swimFreq * this.renderTime + this.swimOffset;
    return this.swimAmp * (0.08 + s * s) * Math.sin(phase - s * 3.2) + this.swimBend * s * s;
  }

  /** The tail-beat phase runs on the GPU; only send a new frequency/amplitude when the rhythm
   *  has changed noticeably, keeping the phase continuous. */
  updateSwimRhythm(hz, dt) {
    this.sinceRhythmUpdate += dt;
    const freq = quantize(hz * TAU);
    const freqChanged = Math.abs(freq - this.swimFreq) > this.swimFreq * 0.12;
    const ampChanged = Math.abs(this.smoothedAmp - this.swimAmp) > this.swimAmp * 0.12 + this.model.length * 0.002;
    if (!(this.sinceRhythmUpdate > 0.16 && (freqChanged || ampChanged))) return;
    this.sinceRhythmUpdate = 0;
    if (freqChanged) {
      const t = this.renderTime;
      this.swimOffset = (this.swimFreq * t + this.swimOffset - freq * t) % TAU;
      this.swimFreq = freq;
      this.swim.swimFreq.value = this.swimFreq;
      this.swim.swimOffset.value = this.swimOffset;
    }
    if (ampChanged) {
      this.swimAmp = this.smoothedAmp;
      this.swim.swimAmp.value = this.swimAmp;
    }
  }

  /** Hover and brake ease on the GPU; they're only sent when they have changed noticeably. */
  updateFins(dt) {
    this.sinceFinUpdate += dt;
    const goal = new THREE.Vector2(this.hover, this.brake);
    if (!(this.sinceFinUpdate > 0.3 && goal.distanceTo(this.finTo) > 0.12)) return;
    this.sinceFinUpdate = 0;
    this.finFrom = this.eased2(this.finFrom, this.finTo, this.finTime, 0.4);
    this.finTo = goal;
    this.finTime = this.renderTime;
    this.finU.finFrom.value.set(this.finFrom.x, this.finFrom.y, 0, 0);
    this.finU.finTo.value.set(this.finTo.x, this.finTo.y, 0, 0);
    this.finU.finTime.value = this.finTime;
  }

  /** How strongly light shines through the fins: sunlight by day; at night only in the lamp's cone. */
  updateGlow(dt, fish, tank) {
    const light = tank.lighting;
    if (!this.lampSent) {
      this.lampSent = true;
      this.finU.lampPos.value.copy(light.spotPosition);
    }
    this.sinceGlowUpdate += dt;
    if (!(this.sinceGlowUpdate > 0.25)) return;
    const night = 1 - this.causticScale;
    let goal = this.causticScale;
    if (night > 0) {
      const aim = unit(light.spotTarget.clone().sub(light.spotPosition));
      const angle = Math.acos(clamp(unit(fish.pos.clone().sub(light.spotPosition)).dot(aim), -1, 1));
      const inBeam = 1 - smoothstep(light.spotHalfAngle * 0.7, light.spotHalfAngle * 1.3, angle);
      goal += night * 1.3 * inBeam;
    }
    const nightChanged = !isFinite(this.sinceGlowUpdate);
    if (!(nightChanged || Math.abs(goal - this.glowTo) > 0.1 || (goal < 0.02 && this.glowTo > 0))) return;
    this.sinceGlowUpdate = 0;
    this.glowFrom = this.eased2(new THREE.Vector2(this.glowFrom, 0), new THREE.Vector2(this.glowTo, 0), this.glowTime, 0.5).x;
    this.glowTo = goal < 0.02 ? 0 : goal;
    this.glowTime = this.renderTime;
    this.finU.finGlow.value.set(this.glowFrom, this.glowTo, this.glowTime, night);
  }

  /** Where a value easing linearly from a to b over `duration` from `start` is now, as the
   *  shaders compute it (after the hourly time wrap it counts as arrived). */
  eased2(a, b, start, duration) {
    const t = this.renderTime - start;
    return a.clone().lerp(b, t < 0 ? 1 : Math.min(1, t / duration));
  }

  updateBend(dt) {
    this.sinceBendUpdate += dt;
    if (!(this.sinceBendUpdate > 0.08 && Math.abs(this.targetBend - this.swimBend) > this.model.length * 0.015)) return;
    this.sinceBendUpdate = 0;
    this.swimBend = Math.abs(this.targetBend) < this.model.length * 0.01 ? 0 : this.targetBend;
    this.swim.swimBend.value = this.swimBend;
  }

  updateJaw() {
    const jaw = this.model.jaw;
    if (!jaw || !this.jawPivot) return;
    const lateral = this.lateralOffset(jaw.midX);
    this.jawPivot.position.set(jaw.hinge.x, jaw.hinge.y, jaw.hinge.z + lateral);
    // The lower jaw drops, front first, about the hinge at the back of the mouth.
    this.jawPivot.rotation.set(0, 0, -0.75 * this.mouthOpen);
    this.upperTeeth.position.set(0, 0, lateral);
    this.palate.position.set(0, 0, lateral);
    // The inside of the mouth only exists while it's open.
    const shut = this.mouthOpen < 0.03;
    this.upperTeeth.visible = !shut;
    this.lowerTeeth.visible = !shut;
    this.palate.visible = !shut;
  }
}

// ---------------------------------------------------------------------------------------------
// EyeRig (FishEyes.swift): each eye swivels on its own toward whatever catches its attention,
// otherwise rests with a slow drift and the odd glance. Moves are saccades.
// ---------------------------------------------------------------------------------------------

class EyeRig {
  constructor(model, parent) {
    this.model = model;
    this.node = new THREE.Group();
    this.interest = rnd(0, 1);
    this.clock = rnd(0, 100);
    const material = model.material.clone();
    this.eyes = model.sockets.map((socket) => {
      const mesh = new THREE.Mesh(model.geometry, material);
      mesh.position.copy(socket.center);
      mesh.scale.setScalar(model.radius);
      mesh.quaternion.copy(socket.base);
      this.node.add(mesh);
      return {
        mesh, socket, gaze: new THREE.Vector2(), aim: new THREE.Vector2(), glance: new THREE.Vector2(),
        glanceTimer: rnd(0.5, 3), drift: new THREE.Vector2(rnd(0, TAU), rnd(0, TAU)),
      };
    });
    parent.add(this.node);
  }

  /** `lateral` is the head's sideways swim offset at the eyes, so they stay on the body as it bends. */
  update(dt, fish, tank, lateral) {
    this.node.position.set(0, 0, lateral);
    this.clock += dt;
    let target = this.lookTarget(fish, tank);
    if (target) {
      this.node.updateWorldMatrix(true, false);
      target = this.node.worldToLocal(target.clone());
    }
    const limit = new THREE.Vector2(this.model.reach, this.model.reach * 0.5);
    for (const eye of this.eyes) {
      const s = eye.socket;
      let want = null;
      if (target) {
        const d = unit(target.clone().sub(s.center));
        const dn = d.dot(s.neutral);
        // Only if it's on this eye's side; a clamped direction keeps the eye turned as far as it goes.
        if (dn > -0.1) {
          const a = new THREE.Vector2(Math.atan2(d.dot(s.fore), dn), Math.atan2(d.dot(s.up), dn));
          const e = new THREE.Vector2(a.x / limit.x, a.y / limit.y);
          want = e.length() > 1 ? a.divideScalar(e.length()) : a;
        }
      }
      if (!want) {
        eye.glanceTimer -= dt;
        if (eye.glanceTimer <= 0) {
          // Mostly glance fore/aft, and come back to rest between glances.
          const resting = eye.glance.x === 0 && eye.glance.y === 0;
          eye.glance = resting && Math.random() < 0.7
            ? new THREE.Vector2(rnd(-0.6, 0.6) * limit.x, rnd(-0.3, 0.3) * limit.y) : new THREE.Vector2();
          eye.glanceTimer = eye.glance.x === 0 && eye.glance.y === 0 ? rnd(1, 4) : rnd(0.4, 1.5);
        }
        const drift = new THREE.Vector2(Math.sin(this.clock * 0.31 + eye.drift.x) * limit.x,
          Math.sin(this.clock * 0.19 + eye.drift.y) * limit.y).multiplyScalar(0.15);
        want = eye.glance.clone().add(drift);
      }
      // Saccade to big changes; follow small ones slowly.
      const err = want.clone().sub(eye.aim);
      if (err.length() > 0.09) eye.aim.copy(want);
      else eye.aim.add(err.multiplyScalar(Math.min(1, dt * 2.5)));
      eye.gaze.add(eye.aim.clone().sub(eye.gaze).multiplyScalar(Math.min(1, dt * 25)));
      const dir = s.neutral.clone().add(s.fore.clone().multiplyScalar(Math.tan(eye.gaze.x)))
        .add(s.up.clone().multiplyScalar(Math.tan(eye.gaze.y))).normalize();
      eye.mesh.quaternion.copy(quatFromTo(s.neutral, dir).multiply(s.base));
    }
  }

  /** The world point this fish is most interested in, if any. */
  lookTarget(fish, tank) {
    const shark = tank.shark;
    if (shark) {
      if (shark.body === fish) return shark.state.kind === 'hunting' ? shark.state.target.pos : null;
      if (shark.state.kind === 'hunting' && fish.pos.distanceTo(shark.pos) < shark.body.model.length * 1.6) {
        return shark.pos.clone().add(shark.body.nose).multiplyScalar(0.5);
      }
    }
    const food = tank.nearestFood(fish.pos, 4);
    if (food) return food.pos;
    const c = tank.cursor;
    if (c.present) {
      const reach = c.stillTime > 0.5 ? 220 + 260 * this.interest : 150;
      if (tank.screenDistance(fish.pos, c.screen) < reach) {
        // Where the cursor appears: its line of sight, a little in front of the fish.
        const onRay = tank.closestPointOnCursorRay(fish.pos);
        return onRay.clone().add(unit(v3(0, 0, tank.eyeDistance).sub(onRay)).multiplyScalar(1.5));
      }
    }
    return null;
  }
}

// ---------------------------------------------------------------------------------------------
// Fish behaviour (Fish.swift): wandering, schooling, food, curiosity, fear, glide-and-burst,
// C-start escapes
// ---------------------------------------------------------------------------------------------

/** How a species swims when unhurried: bursts of tail beats separated by glides (seconds). */
function strokeFor(sp) {
  switch (sp.id) {
    case Species.neonTetra.id: return { beat: [0.25, 0.45], glide: [0.3, 0.7], boost: 1.3, pickup: 3, drag: 1.5 };
    case Species.angelfish.id: return { beat: [0.5, 0.9], glide: [1.4, 2.8], boost: 1.35, pickup: 1.6, drag: 0.45 };
    case Species.clownfish.id: return { beat: [0.3, 0.6], glide: [0.2, 0.45], boost: 1.1, pickup: 2, drag: 1.3 };
    case Species.betta.id: return { beat: [0.7, 1.2], glide: [0.9, 1.7], boost: 1.1, pickup: 1.5, drag: 0.6 };
    default: return { beat: [0.7, 1.3], glide: [0.8, 1.5], boost: 1.2, pickup: 1.5, drag: 0.65 };
  }
}

class Fish {
  constructor(species, p) {
    this.species = species;
    this.stroke = strokeFor(species);
    this.model = FishModel.forSpecies(species);
    this.size = rnd(0.85, 1.15);
    this.rig = new FishRig(this.model, this.size);
    this.pos = p.clone();
    const angle = rnd(0, TAU);
    this.vel = v3(Math.cos(angle), 0, Math.sin(angle)).multiplyScalar(species.cruise * Fish.speedUnit * 0.5);
    this.goal = v3();
    this.goalTimer = 0;
    this.fear = 0;
    this.fleeDir = v3();
    this.yaw = Math.atan2(-this.vel.z, this.vel.x);
    this.roll = 0;
    this.orientation = quatAxis(this.yaw, 0, 1, 0);
    // Personality: curious fish come over to inspect a resting cursor.
    this.curiosity = rnd(0, 1);
    this.speedJitter = rnd(0.8, 1.2);
    this.hoverOffset = v3(rnd(0.45, 1.0) * (coin() ? 1 : -1), rnd(-0.4, 0.4), rnd(0.8, 3.5));
    this.schoolOffset = v3(rnd(-0.9, 0.9), rnd(-0.5, 0.5), rnd(-0.9, 0.9));
    this.beating = coin();
    this.strokeTimer = rnd(0, 0.5);
    this.thrust = 1;
    this.escapeTimer = 0;
    this.escapeKick = false;
    this.escapeCooldown = 0;
    this.lastForward = this.forward;
    this.node.position.copy(this.pos);
    this.node.quaternion.copy(this.orientation);
  }

  get node() { return this.rig.node; }
  get mouthOpen() { return this.rig.mouthOpen; }
  set mouthOpen(v) { this.rig.mouthOpen = v; }
  get forward() { return v3(1, 0, 0).applyQuaternion(this.orientation); }
  get nose() { return this.pos.clone().add(this.forward.multiplyScalar(this.model.length * 0.5 * this.size)); }

  update(dt, tank) {
    const sp = this.species;
    const cruise = sp.cruise * Fish.speedUnit * this.speedJitter;
    const burst = sp.burst * Fish.speedUnit;
    const c = tank.cursor;
    const desired = v3();
    let lookAt = null;
    const depthFrac = clamp(-this.pos.z / tank.depth, 0, 1);
    const fearBefore = this.fear;

    // --- Startle: react to where the fish *appears* relative to a fast-moving cursor.
    if (c.present) {
      const s2 = tank.project(this.pos);
      const dScreen = Math.hypot(s2.x - c.screen.x, s2.y - c.screen.y);
      const speed = c.speed;
      const moving = speed > 140;
      const radius = (110 + Math.min(speed, 2500) * 0.1) * (1 - 0.45 * depthFrac);
      if (dScreen < radius && (moving || dScreen < 45)) {
        const intensity = moving ? Math.min(1.4, 0.45 + speed / 900) : 0.5;
        const startle = Math.min(1, (1 - dScreen / radius) * intensity);
        if (startle > this.fear) {
          this.fear = startle;
          this.goalTimer = 0;
        }
        // Away from the cursor's line of sight, and back from the glass where the "hand" is.
        const away = unit(this.pos.clone().sub(tank.closestPointOnCursorRay(this.pos))).add(v3(0, 0, -0.7));
        if (moving) {
          // Dart sideways out of the cursor's path.
          const mv = unit(v3(c.vel.dx, c.vel.dy, 0));
          const side = v3(-mv.y, mv.x, 0);
          away.add(side.multiplyScalar(away.dot(side) >= 0 ? 0.8 : -0.8));
        }
        this.fleeDir = unit(away);
      }
    }
    // --- A hunting shark nearby: scatter.
    const threat = tank.shark ? tank.shark.threat(this) : null;
    if (threat) {
      if (threat.intensity > this.fear) {
        this.fear = threat.intensity;
        this.goalTimer = 0;
      }
      this.fleeDir = threat.away;
    }
    this.fear = Math.max(0, this.fear - dt * 0.55);
    const panic = this.escape(dt, fearBefore, burst);

    // --- Pick what we're swimming toward.
    let target;
    let targetSpeed = cruise;
    let feeding = false;
    const food = this.fear < 0.35 ? tank.nearestFood(this.pos, 7.5) : null;
    if (food) {
      target = food.pos.clone();
      targetSpeed = cruise * 2.2;
      feeding = true;
      if (this.nose.distanceTo(food.pos) < Math.max(0.1, this.model.length * 0.25 * this.size)) {
        tank.eat(food);
        this.rig.gulp();
      }
    } else if (c.present && c.stillTime > 0.7 && this.fear < 0.05 && this.curiosity > 0.45
      && tank.screenDistance(this.pos, c.screen) < 420) {
      // Swim up close, beside the cursor's line of sight, and turn to face the viewer.
      const g = tank.cursorGlassPoint;
      const z = Math.min(this.hoverOffset.z, tank.frontZ - 0.8);
      const f = (tank.eyeDistance - z) / tank.eyeDistance;
      target = v3((g.x + this.hoverOffset.x) * f, (g.y + this.hoverOffset.y) * f, z);
      targetSpeed = cruise * 1.2;
      lookAt = v3(g.x * f, g.y * f, z + 3);
    } else if (sp.schooling && tank.schoolGoal(sp)) {
      target = tank.schoolGoal(sp).clone().add(this.schoolOffset);
    } else {
      this.goalTimer -= dt;
      if (this.goalTimer <= 0 || this.pos.distanceTo(this.goal) < 0.3) this.pickGoal(tank);
      target = this.goal.clone();
    }
    const toTarget = target.clone().sub(this.pos);
    // Close to where it wants to be: hold station on the pectorals instead of beating the tail.
    const hovering = toTarget.length() < 0.6 && this.vel.length() < cruise * 0.6 && this.fear < 0.1;
    const propelling = this.updateStroke(dt, feeding || this.fear > 0.2, hovering);
    const surging = propelling && !hovering;
    const pace = surging ? this.stroke.boost : 1;
    desired.add(unit(toTarget).multiplyScalar(targetSpeed * pace * Math.min(1, toTarget.length() / 1.0) * (1 - this.fear)));

    // --- Neighbours: personal space, and schooling with our own kind.
    const align = v3(), centre = v3();
    let n = 0;
    const myRadius = this.model.length * this.size;
    for (const o of tank.fish) {
      if (o === this) continue;
      const dv = this.pos.clone().sub(o.pos);
      const d = dv.length();
      const minD = (myRadius + o.model.length * o.size) * 0.55 + 0.05;
      if (d < minD && d > 0.0001) desired.add(unit(dv).multiplyScalar((1 - d / minD) * cruise * 1.6));
      if (sp.schooling && o.species.id === sp.id && d < 1.6) {
        align.add(o.vel);
        centre.add(o.pos);
        n += 1;
      }
    }
    if (n > 0) {
      desired.add(align.divideScalar(n).sub(this.vel).multiplyScalar(0.35));
      desired.add(unit(centre.divideScalar(n).sub(this.pos)).multiplyScalar(cruise * 0.25));
    }

    // --- Steer around big scenery (reef mounds, corals).
    for (const o of tank.obstacles) {
      const dv = this.pos.clone().sub(o.center);
      const d = dv.length();
      const r = o.radius + myRadius * 0.5 + 0.2;
      if (d < r && d > 0.0001) desired.add(unit(dv).multiplyScalar((1 - d / r) * cruise * 3));
    }

    // --- Stay inside the tank (soft walls).
    const b = tank.bounds(this.pos, myRadius);
    const push = cruise * 2.5;
    const m = 0.9;
    const p = this.pos;
    if (p.x < b.minX + m) desired.x += (b.minX + m - p.x) / m * push;
    if (p.x > b.maxX - m) desired.x -= (p.x - (b.maxX - m)) / m * push;
    if (p.y < b.minY + m * 0.6) desired.y += (b.minY + m * 0.6 - p.y) / (m * 0.6) * push;
    if (p.y > b.maxY - m * 0.6) desired.y -= (p.y - (b.maxY - m * 0.6)) / (m * 0.6) * push;
    if (p.z < b.minZ + m) desired.z += (b.minZ + m - p.z) / m * push;
    if (p.z > b.maxZ - m * 0.5) desired.z -= (p.z - (b.maxZ - m * 0.5)) / (m * 0.5) * push;

    // --- Flee.
    desired.add(this.fleeDir.clone().multiplyScalar(burst * this.fear));

    // --- Coasting: without the tail nothing adds speed; water drag slowly bleeds it off.
    if (!propelling && panic < 0.01) {
      this.vel.multiplyScalar(Math.max(0, 1 - this.stroke.drag * dt));
      const coast = this.vel.length();
      const want = desired.length();
      if (want > coast) desired.multiplyScalar(coast / want);
    }

    // Tail beats also make for quicker turns and pickup than a glide.
    const agility = (1.6 + 7 * panic) * (surging ? this.stroke.pickup : 1);
    this.rig.thrust = this.thrust;
    this.move(desired, dt, cruise, (cruise * 1.4 + (burst - cruise * 1.4) * panic) * pace, agility,
      cruise * 0.8 + burst * panic * 0.5, panic, lookAt, b, tank);
  }

  /** Advance the burst-and-glide cycle and ease `thrust` toward it. Returns whether the fish is
   *  under power (false = coasting). */
  updateStroke(dt, sustained, hovering) {
    this.strokeTimer -= dt;
    // A glide ends early once the fish has slowed right down.
    const slow = this.vel.length() < this.species.cruise * Fish.speedUnit * 0.45;
    if (this.strokeTimer <= 0 || (!this.beating && slow && !hovering)) {
      this.beating = !this.beating;
      this.strokeTimer = this.beating ? rnd(...this.stroke.beat) : rnd(...this.stroke.glide);
    }
    const powered = sustained || this.escapeTimer > 0 || this.beating;
    const goal = hovering
      ? clamp(0.1 + 0.6 * this.vel.length() / (this.species.cruise * Fish.speedUnit), 0.1, 0.45)
      : (powered ? 1 : 0);
    // The tail picks up quickly and settles a little more gently.
    this.thrust += (goal - this.thrust) * Math.min(1, dt * (goal > this.thrust ? 10 : 7));
    return powered || hovering;
  }

  /** C-start: on the onset of a fright, curl hard into a C away from the threat, pivot toward the
   *  escape, then push off at burst speed. Returns the effective panic level. */
  escape(dt, fearBefore, burst) {
    this.escapeCooldown -= dt;
    if (this.fear > 0.4 && fearBefore <= 0.4 && this.escapeCooldown <= 0) {
      this.escapeTimer = 0.4;
      this.escapeKick = true;
      this.escapeCooldown = rnd(1.4, 2.2);
      // Which side of the fish the escape lies on (its local +z / -z).
      const side = this.fleeDir.dot(v3(0, 0, 1).applyQuaternion(this.orientation));
      const sign = Math.abs(side) > 0.1 ? (side > 0 ? 1 : -1) : (coin() ? 1 : -1);
      this.rig.curl(sign * (0.35 + 0.2 * Math.min(1, this.fear)));
      // Stage one: pivot toward the escape without much forward travel.
      this.vel = this.fleeDir.clone().multiplyScalar(this.vel.length() * 0.4);
    }
    if (!(this.escapeTimer > 0)) return this.fear;
    this.escapeTimer -= dt;
    if (this.escapeKick && this.escapeTimer < 0.32) {
      // Stage two: the tail snaps back and the fish shoots off.
      this.escapeKick = false;
      this.vel = this.fleeDir.clone().multiplyScalar(Math.max(this.vel.length(), burst * (0.6 + 0.2 * this.fear)));
    }
    return Math.max(this.fear, Math.min(1, this.escapeTimer / 0.25));
  }

  /** Steer toward the desired velocity, stay inside b, turn to face the heading (or `lookAt` when
   *  nearly still), bank into turns and animate the tail. Shared by fish and the shark. */
  move(desired, dt, cruise, maxSpeed, agility, maxClimb, excitement, lookAt, b, tank) {
    this.vel.add(desired.clone().sub(this.vel).multiplyScalar(Math.min(1, dt * agility)));
    this.vel.clampLength(0, maxSpeed);
    // Fish rarely swim straight up or down.
    this.vel.y = clamp(this.vel.y, -maxClimb, maxClimb);
    this.pos.addScaledVector(this.vel, dt);
    this.pos.x = clamp(this.pos.x, b.minX - 0.2, b.maxX + 0.2);
    this.pos.y = clamp(this.pos.y, b.minY - 0.1, b.maxY + 0.1);
    this.pos.z = clamp(this.pos.z, b.minZ - 0.2, b.maxZ + 0.1);

    // --- Orientation: head along velocity (or toward what we're looking at), bank into turns.
    const speed = this.vel.length();
    let heading = this.vel.clone();
    if (lookAt && speed < cruise * 0.6) heading = lookAt.clone().sub(this.pos);
    const flat = Math.hypot(heading.x, heading.z);
    if (flat > 0.02 || Math.abs(heading.y) > 0.02) {
      const newYaw = flat > 0.01 ? Math.atan2(-heading.z, heading.x) : this.yaw;
      const pitch = clamp(Math.atan2(heading.y, Math.max(flat, 0.001)), -0.6, 0.6);
      const yawRate = angleDelta(newYaw, this.yaw) / Math.max(dt, 0.001);
      this.yaw = newYaw;
      this.roll += (clamp(-yawRate * 0.12, -0.5, 0.5) - this.roll) * Math.min(1, dt * 3);
      const q = quatAxis(this.yaw, 0, 1, 0).multiply(quatAxis(pitch, 0, 0, 1)).multiply(quatAxis(this.roll, 1, 0, 0));
      this.orientation.slerp(q, Math.min(1, dt * (3 + 8 * excitement)));
    }

    // How fast the body is actually rotating, for the turn bend.
    const fwd = this.forward;
    const turnRate = dt > 0
      ? angleDelta(Math.atan2(-fwd.z, fwd.x), Math.atan2(-this.lastForward.z, this.lastForward.x)) / dt : 0;
    this.lastForward = fwd;

    this.node.position.copy(this.pos);
    this.node.quaternion.copy(this.orientation);
    this.rig.animate(dt, this, speed, cruise, excitement, turnRate, tank);
  }

  pickGoal(tank) {
    // Clownfish mostly stay close to their anemone.
    if (this.species.id === Species.clownfish.id && tank.anemoneTop && Math.random() < 0.75) {
      this.goal = tank.anemoneTop.clone().add(v3(rnd(-0.5, 0.5), rnd(0.05, 0.6), rnd(-0.45, 0.45)));
      this.goalTimer = rnd(2, 5);
      return;
    }
    this.goal = tank.wanderPoint(this.species.band, this.pos);
    this.goalTimer = rnd(4, 11);
  }

  /** Fish get no caustics or fin glow at night. */
  setCausticScale(scale) { this.rig.setCausticScale(scale); }
}
/** Screen-points-per-second in the species data → world units per second. */
Fish.speedUnit = 1.2 / 100;

// ---------------------------------------------------------------------------------------------
// The shark (Shark.swift): lurks in the haze, now and then hunts a fish, then retreats
// ---------------------------------------------------------------------------------------------

class Shark {
  constructor(tank) {
    this.body = new Fish(Species.shark, v3());
    this.body.node.scale.setScalar(1);
    this.clock = 0;
    this.biteTimer = 0;
    this.gliding = false;
    this.glideTimer = 2;
    this.state = { kind: 'lurking', until: Shark.huntSoon ? 2 : rnd(15, 40) };
    this.patrol = this.lurkPoint(tank);
    this.body.pos = this.lurkPoint(tank);
    this.body.node.position.copy(this.body.pos);
  }

  get pos() { return this.body.pos; }

  update(dt, tank) {
    this.clock += dt;
    const sp = this.body.species;
    const cruise = sp.cruise * Fish.speedUnit;
    let desired = v3();
    let speed = cruise;
    let excitement = 0;
    // How wide the mouth should be, and how fast it gets there.
    let gape = 0;
    let jawRate = 3;
    const pos = this.pos;

    switch (this.state.kind) {
      case 'lurking': {
        // Slow patrols around the hazy region behind the tank, gliding between a few tail beats.
        this.glideTimer -= dt;
        if (this.glideTimer <= 0) {
          this.gliding = !this.gliding;
          this.glideTimer = this.gliding ? rnd(2.5, 5) : rnd(1.5, 3);
        }
        speed = cruise * (this.gliding ? 1.2 : 1.8);
        if (pos.distanceTo(this.patrol) < 1.5) this.patrol = this.lurkPoint(tank);
        desired = unit(this.patrol.clone().sub(pos)).multiplyScalar(speed);
        if (this.clock > this.state.until) {
          const prey = this.pickPrey(tank);
          if (prey) this.state = { kind: 'hunting', target: prey, since: this.clock };
        }
        break;
      }
      case 'hunting': {
        const prey = this.state.target;
        if (!tank.fish.includes(prey) || this.clock - this.state.since >= 10) {
          this.state = { kind: 'retreating' };
          break;
        }
        // Aim a little ahead of the prey; charge in from the dark, then lunge from close range.
        const lead = prey.pos.clone().addScaledVector(prey.vel, 0.35);
        const d = this.body.nose.distanceTo(prey.pos);
        const close = this.body.model.length * 0.7;
        speed = d > close ? 5.5 : 9;
        excitement = d > close ? 0.7 : 1;
        desired = unit(lead.sub(pos)).multiplyScalar(speed);
        // Jaws part as it closes in, and gape wide for the final lunge.
        gape = d > close * 1.6 ? 0.15 : 1;
        jawRate = 6;
        if (d < 0.3 + prey.model.length * prey.size * 0.5) {
          tank.eaten(prey);
          this.state = { kind: 'retreating' };
          this.patrol = this.lurkPoint(tank);
          this.biteTimer = 0.5;
        }
        break;
      }
      case 'retreating':
        // Back into the dark quickly, easing off as it disappears into the murk.
        speed = pos.z > -tank.depth - 6 ? 4.5 : 2;
        excitement = 0.5;
        desired = unit(this.patrol.clone().sub(pos)).multiplyScalar(speed);
        if (pos.z < -tank.depth - 10 || pos.distanceTo(this.patrol) < 2) {
          this.state = { kind: 'lurking', until: this.clock + rnd(30, 110) };
        }
        break;
    }

    if (this.biteTimer > 0) {
      this.biteTimer -= dt;
      gape = 0;
      jawRate = 18;
    }
    this.body.mouthOpen += (gape - this.body.mouthOpen) * Math.min(1, dt * jawRate);
    this.body.rig.thrust = this.state.kind === 'lurking' && this.gliding ? 0.1 : 1;

    // Steer around the reef.
    for (const o of tank.obstacles) {
      const dv = pos.clone().sub(o.center);
      const d = dv.length();
      const r = o.radius + this.body.model.length * 0.4 + 0.3;
      if (d < r && d > 0.0001) desired.add(unit(dv).multiplyScalar((1 - d / r) * speed * 2));
    }

    // Soft walls: turn back well before reaching the edge of its space.
    const b = this.roamBounds(tank, pos.x, pos.z);
    const m = 1.5, push = Math.max(speed, cruise * 2) * 1.5;
    if (pos.x < b.minX + m) desired.x += (b.minX + m - pos.x) / m * push;
    if (pos.x > b.maxX - m) desired.x -= (pos.x - (b.maxX - m)) / m * push;
    if (pos.y < b.minY + m * 0.5) desired.y += (b.minY + m * 0.5 - pos.y) / (m * 0.5) * push;
    if (pos.y > b.maxY - m * 0.5) desired.y -= (pos.y - (b.maxY - m * 0.5)) / (m * 0.5) * push;
    if (pos.z < b.minZ + m) desired.z += (b.minZ + m - pos.z) / m * push;
    if (pos.z > b.maxZ - m) desired.z -= (pos.z - (b.maxZ - m)) / m * push;
    this.body.move(desired, dt, cruise, speed, 1.2 + 3.5 * excitement, speed * 0.5, excitement, null, b, tank);
  }

  /** How a fish should react to the shark: flee direction and fear, or null. */
  threat(fish) {
    const hunting = this.state.kind === 'hunting';
    const isPrey = hunting && this.state.target === fish;
    // Scaled to the shark's size (these suit a ~3-unit-long shark).
    const reach = this.body.model.length / 3;
    const radius = (isPrey ? 4 : (hunting ? 3 : 1.6)) * reach;
    const dv = fish.pos.clone().sub(this.pos);
    const d = dv.length();
    if (!(d < radius)) return null;
    // Away from the shark and out of its path.
    const side = unit(this.body.vel).cross(v3(0, 1, 0));
    const away = unit(unit(dv).add(side.multiplyScalar(dv.dot(side) >= 0 ? 0.7 : -0.7)));
    return { away, intensity: Math.min(1, (1 - d / radius) * (hunting ? 1.3 : 0.5)) };
  }

  /** The space the shark may occupy at depth z, allowing for its size. */
  roamBounds(tank, x, z) {
    const len = this.body.model.length;
    const hw = tank.halfWidth(z) - len * 0.35;
    const hh = tank.halfHeight(z);
    return {
      minX: -hw, maxX: hw,
      minY: tank.floorHeight(x, z) + len * 0.15 + 0.4,
      maxY: Math.min(tank.surfaceY, hh * 0.91) - len * 0.12 - 0.3,
      minZ: -tank.depth - 13.5, maxZ: tank.frontZ - 2,
    };
  }

  /** Deep in the haze behind where the fish swim, just short of where the fog turns opaque. */
  lurkPoint(tank) {
    const z = -tank.depth - rnd(11.5, 13);
    const b0 = this.roamBounds(tank, 0, z);
    const x = rnd(b0.minX + 1.5, b0.maxX - 1.5);
    const b = this.roamBounds(tank, x, z);
    const lo = b.minY + 0.8, hi = Math.max(lo, b.maxY - 0.8);
    return v3(x, lo + (hi - lo) * rnd(0.2, 0.8), z);
  }

  /** A fish to go after: not too close to the viewer, never a clownfish sheltering in its anemone. */
  pickPrey(tank) {
    const candidates = tank.fish.filter((f) => {
      if (f.pos.z > 1.5) return false;
      if (f.species.id === Species.clownfish.id && tank.anemoneTop && f.pos.distanceTo(tank.anemoneTop) < 1) return false;
      return true;
    });
    return candidates.length ? pick(candidates) : null;
  }
}
Shark.huntSoon = false;

// ---------------------------------------------------------------------------------------------
// Sinking food flakes (Food.swift)
// ---------------------------------------------------------------------------------------------

class Food {
  constructor(p) {
    if (!Food.geometry) {
      Food.geometry = new THREE.SphereGeometry(0.028, 8, 6);
      Tank.sharedGeometry.add(Food.geometry);
    }
    Food.material ??= new THREE.MeshStandardMaterial({ color: new RGBA(0.72, 0.42, 0.18).color, roughness: 0.7, transparent: true });
    this.node = new THREE.Mesh(Food.geometry, Food.material.clone());
    this.node.castShadow = true;
    this.pos = p.clone();
    this.vy = rnd(-0.15, -0.05);
    this.age = 0;
    this.wobble = rnd(0, TAU);
    this.eaten = false;
    this.node.position.copy(p);
    this.node.scale.set(rnd(0.8, 1.2), rnd(0.5, 0.8), rnd(0.8, 1.2));
  }

  /** Returns false once the flake has dissolved or been eaten. */
  update(dt, floor) {
    this.age += dt;
    if (this.pos.y > floor) {
      this.vy = Math.max(this.vy - 0.18 * dt, -0.26);
      this.pos.y = Math.max(floor, this.pos.y + this.vy * dt);
      this.pos.x += Math.sin(this.age * 2 + this.wobble) * 0.08 * dt;
      this.node.rotation.x += dt * 0.6;
      this.node.rotation.y += dt * 0.4;
    }
    this.node.position.copy(this.pos);
    const life = 40;
    this.node.material.opacity = clamp((life - this.age) / 4, 0, 1);
    return this.age < life && !this.eaten;
  }
}
// ---------------------------------------------------------------------------------------------
// The reef (Coral.swift): brain, branching, table and finger corals, polyps and live rock, merged
// into one mesh and coloured from a shaded palette (each row a colour, dark u = 0 to pale u = 1)
// ---------------------------------------------------------------------------------------------

const ReefTone = { pink: 0, orange: 1, purple: 2, tan: 3, teal: 4, bone: 5, red: 6, green: 7, rock: 8, coralline: 9, rockPurple: 10 };
const REEF_COLORS = [
  new RGBA(0.92, 0.46, 0.52), new RGBA(0.95, 0.52, 0.22), new RGBA(0.56, 0.32, 0.68), new RGBA(0.82, 0.70, 0.42),
  new RGBA(0.30, 0.62, 0.55), new RGBA(0.88, 0.84, 0.76), new RGBA(0.78, 0.18, 0.18), new RGBA(0.35, 0.78, 0.45),
  new RGBA(0.40, 0.37, 0.33), new RGBA(0.62, 0.42, 0.50), new RGBA(0.42, 0.33, 0.40),
];

class CoralReef {
  constructor() {
    this.mesh = new Mesh();
    this.pieceOfVertex = [];
    this.occluders = [];
  }

  /** `shade` 0...1 runs dark to pale within the palette's normal range (occlusion can go darker). */
  uv(tone, shade) {
    return [0.05 + (0.15 + 0.85 * clamp(shade, 0, 1)) * 0.9, (tone + 0.5) / REEF_COLORS.length];
  }

  /** A domed brain coral with meandering grooves. */
  addBrain(base, radius, tone) {
    const m = Mesh.icosphere(radius > 0.35 ? 5 : 4);
    const s = [rnd(0, TAU), rnd(0, TAU), rnd(0, TAU)];
    const f = rnd(11, 14);
    for (let i = 0; i < m.count; i++) {
      const p = m.pos(i);
      // Contours of a warped noise field make winding valleys between rounded ridges.
      const g = Math.sin(f * p.x + 2.5 * Math.sin(9 * p.y + s[0])) + Math.sin(f * p.y + 2.5 * Math.sin(9 * p.z + s[1]))
        + Math.sin(f * p.z + 2.5 * Math.sin(9 * p.x + s[2]));
      const ridge = Math.abs(Math.sin(g * 1.6));
      const q = p.multiplyScalar(1 + 0.045 * (ridge - 0.5));
      q.y = Math.max(q.y * 0.72, -0.08);
      m.setPos(i, q.multiplyScalar(radius));
      m.addUV(this.uv(tone, 0.25 + 0.65 * ridge));
    }
    this.add(m, base, v3(0, radius * 0.3, 0), radius * 0.85);
  }

  /** A staghorn-style coral: tapering branches that split, with pale growing tips. */
  addBranching(base, height, tone) {
    const m = new Mesh();
    const maxDepth = 4;
    const grow = (p, dir, len, radius, depth) => {
      const bend = v3(rnd(-0.3, 0.3), rnd(-0.1, 0.2), rnd(-0.3, 0.3));
      const mid = p.clone().add(unit(dir.clone().addScaledVector(bend, 0.4)).multiplyScalar(len * 0.5));
      const end = mid.clone().add(unit(dir.clone().add(bend)).multiplyScalar(len * 0.5));
      const last = depth === maxDepth;
      const t0 = depth / (maxDepth + 1), t1 = (depth + 1) / (maxDepth + 1);
      const tipR = last ? radius * 0.35 : radius * 0.75;
      m.append(PlantBed.tube([p, mid, end], [radius, radius * 0.88, tipR], 7, (t) => this.uv(tone, 0.2 + 0.75 * (t0 + (t1 - t0) * t))));
      if (last) {
        m.append(this.cap(end, tipR, tone));
        return;
      }
      for (let k = randInt(2, 3); k > 0; k--) {
        const d = unit(dir.clone().multiplyScalar(0.6).add(unit(v3(rnd(-1, 1), rnd(0.3, 1), rnd(-1, 1))).multiplyScalar(0.7)));
        grow(end, d, len * rnd(0.7, 0.85), radius * 0.75, depth + 1);
      }
    };
    grow(v3(), v3(0, 1, 0), height * 0.32, height * 0.07, 0);
    this.add(m, base, v3(0, height * 0.4, 0), height * 0.3);
  }

  /** A table coral: a wavy plate on a short stalk, paler toward the rim. */
  addTable(base, radius, tone) {
    const m = PlantBed.tube([v3(0, 0, 0), v3(0, radius * 0.25, 0), v3(0, radius * 0.45, 0)],
      [radius * 0.22, radius * 0.14, radius * 0.18], 10, () => this.uv(tone, 0.3));
    const rings = 8, segs = 40;
    const phase = rnd(0, TAU);
    const plate = (offset) => {
      const p = new Mesh();
      for (let r = 0; r <= rings; r++) {
        const t = r / rings;
        for (let s = 0; s <= segs; s++) {
          const a = s / segs * TAU;
          const rr = radius * t * (1 + 0.08 * Math.sin(a * 5 + phase));
          const y = radius * 0.45 + radius * (0.12 * t * t + 0.05 * t * Math.sin(a * 3 + phase)) + offset;
          p.p.push(Math.cos(a) * rr, y, Math.sin(a) * rr);
          p.addUV(this.uv(tone, 0.3 + 0.65 * t));
        }
      }
      for (let r = 0; r < rings; r++) {
        for (let s = 0; s < segs; s++) {
          const a = r * (segs + 1) + s, b = a + segs + 1;
          if (offset >= 0) p.quad(a, a + 1, b, b + 1); else p.quad(a + 1, a, b + 1, b);
        }
      }
      return p;
    };
    m.append(plate(0));
    m.append(plate(-radius * 0.05));
    this.add(m, base, v3(0, radius * 0.5, 0), radius * 0.8);
  }

  /** A porous lump of live rock, for building reef mounds. */
  addRock(base, size, tone) {
    const m = Mesh.icosphere(3);
    const s = Array.from({ length: 5 }, () => rnd(0, TAU));
    const shades = [];
    for (let i = 0; i < m.count; i++) {
      const p = m.pos(i);
      const bump = 1 + 0.14 * Math.sin(p.x * 3 + s[0]) * Math.cos(p.z * 2.5 + s[1]) + 0.08 * Math.sin(p.y * 5 + s[2]);
      // Small pits and nodules give it a rough, porous look.
      const pits = Math.sin(p.x * 17 + s[3]) * Math.sin(p.y * 19 + s[4]) * Math.sin(p.z * 15);
      const k = bump + 0.05 * pits;
      const q = v3(p.x * k * size.x, p.y * k * size.y, p.z * k * size.z);
      q.y = Math.max(q.y, -size.y * 0.35);
      m.setPos(i, q);
      shades.push(0.35 + 0.35 * (pits * 0.5 + 0.5) + 0.2 * Math.max(0, p.y));
    }
    // Blotches of pink coralline algae on the upper surfaces.
    const blotch = [rnd(0, TAU), rnd(0, TAU), rnd(0, TAU)];
    for (let i = 0; i < m.count; i++) {
      const p = m.pos(i);
      const x = p.x / size.x, y = p.y / size.y, z = p.z / size.z;
      const n = Math.sin(x * 7 + blotch[0]) * Math.sin(z * 7 + blotch[1]) + 0.6 * Math.sin(y * 9 + x * 3 + blotch[2]);
      const coralline = n > 0.55 && y > 0;
      m.addUV(this.uv(coralline ? ReefTone.coralline : tone, shades[i]));
    }
    this.add(m, base, v3(), (size.x + size.y + size.z) / 3 * 0.95);
  }

  /** A clump of finger (pillar) coral: upright rounded columns. */
  addFingers(base, size, tone) {
    const m = new Mesh();
    for (let k = randInt(5, 9); k > 0; k--) {
      const off = v3(rnd(-1, 1), 0, rnd(-1, 1)).multiplyScalar(size * 0.35);
      const h = size * rnd(0.5, 1.0), r = size * rnd(0.07, 0.11);
      const lean = v3(rnd(-0.15, 0.15), 0, rnd(-0.15, 0.15)).multiplyScalar(h);
      const pts = [off, off.clone().add(v3(0, h * 0.5, 0)).addScaledVector(lean, 0.3), off.clone().add(v3(0, h, 0)).add(lean)];
      m.append(PlantBed.tube(pts, [r * 1.1, r, r * 0.95], 8, (t) => this.uv(tone, 0.35 + 0.5 * t)));
      m.append(this.cap(pts[2], r * 0.95, tone));
    }
    this.add(m, base, v3(0, size * 0.35, 0), size * 0.45);
  }

  /** A cluster of button polyps (zoanthids): little stalked discs with pale centres. */
  addPolyps(base, radius, tone) {
    const m = new Mesh();
    for (let n = randInt(8, 14); n > 0; n--) {
      const a = rnd(0, TAU), d = radius * Math.sqrt(rnd(0, 1));
      const p = v3(Math.cos(a) * d, 0, Math.sin(a) * d);
      const r = radius * rnd(0.16, 0.24), h = radius * rnd(0.15, 0.35);
      m.append(PlantBed.tube([p, p.clone().add(v3(0, h, 0))], [r * 0.6, r * 0.7], 7, () => this.uv(tone, 0.3)));
      // The disc: a flat fan from a bright centre to a darker rim.
      const top = p.clone().add(v3(0, h, 0));
      const c = m.count;
      m.addPos(top.clone().add(v3(0, r * 0.15, 0)));
      m.addUV(this.uv(tone, 1.0));
      for (let k = 0; k <= 10; k++) {
        const ang = k / 10 * TAU;
        m.addPos(top.clone().add(v3(Math.cos(ang) * r, 0, Math.sin(ang) * r)));
        m.addUV(this.uv(tone, 0.5));
      }
      for (let k = 0; k < 10; k++) m.triangle(c, c + 2 + k, c + 1 + k);
    }
    this.add(m, base, v3(0, radius * 0.2, 0), radius * 0.7);
  }

  /** A small smooth pebble. */
  addPebble(base, radius, tone) {
    const m = Mesh.icosphere(1);
    const sq = v3(rnd(0.8, 1.3), rnd(0.45, 0.7), rnd(0.8, 1.2)).multiplyScalar(radius);
    m.mapPositions((p) => p.multiply(sq));
    const uv = this.uv(tone, rnd(0.4, 0.8));
    for (let i = 0; i < m.count; i++) m.addUV(uv);
    this.add(m, base, v3(0, radius * 0.4, 0), radius * 1.1);
  }

  /** Build the merged geometry, baking contact shadows: darker where pieces meet the floor, face
   *  downward, or press against their neighbours. */
  finish(floor) {
    const mesh = this.mesh;
    mesh.computeNormals();
    for (let i = 0; i < mesh.count; i++) {
      const px = mesh.p[i * 3], py = mesh.p[i * 3 + 1], pz = mesh.p[i * 3 + 2];
      const nx = mesh.n[i * 3], ny = mesh.n[i * 3 + 1], nz = mesh.n[i * 3 + 2];
      let vis = 0.3 + 0.7 * smoothstep(-0.05, 0.5, py - floor(px, pz));
      vis *= 0.8 + 0.2 * clamp(ny * 0.5 + 0.5, 0, 1);
      vis *= Occlusion.visibility(px, py, pz, nx, ny, nz, this.occluders, this.pieceOfVertex[i], 1);
      // Shade runs along u in the palette (dark → pale), so occlusion just darkens it.
      const shade = (mesh.uv[i * 2] - 0.05) / 0.9;
      mesh.uv[i * 2] = 0.05 + clamp(shade * vis, 0, 1) * 0.9;
    }
    const geo = mesh.geometry();
    const tex = Art.texture(CoralReef.palette(), { mipmaps: false });
    const mat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.8, metalness: 0 });
    this.causticStrength = { value: 0.7 };
    patchMaterial(mat, {
      key: 'reef',
      uniforms: { ...causticUniforms(), detailNormal: { value: Detail.rock() }, detailScale: { value: 1.1 },
        detailStrength: { value: 0.7 }, causticStrength: this.causticStrength },
      fHead: REEF_HEAD,
      fAfterNormal: REEF_DETAIL,
      fAfterEmissive: CAUSTICS_APPLY('causticStrength'),
    });
    this.material = mat;
    this.node = new THREE.Mesh(geo, mat);
    this.node.castShadow = true;
    this.node.receiveShadow = true;
    this.mesh = null;
    this.pieceOfVertex = null;
  }

  add(piece, base, occOffset, occRadius, rotation = rnd(0, TAU)) {
    piece.n = [];
    const id = this.occluders.length;
    this.occluders.push(occluder(base.clone().add(occOffset), occRadius, id));
    for (let i = 0; i < piece.count; i++) this.pieceOfVertex.push(id);
    this.mesh.append(piece, mat4Translate(base).multiply(mat4Rotate(quatAxis(rotation, 0, 1, 0))));
  }

  cap(p, radius, tone) {
    const m = Mesh.icosphere(1);
    m.mapPositions((q) => q.multiplyScalar(radius).add(p));
    const uv = this.uv(tone, 0.97);
    for (let i = 0; i < m.count; i++) m.addUV(uv);
    m.n = [];
    return m;
  }

  /** Rows of colours, each shading from a deep shadow tone to a pale, sun-bleached tip. */
  static palette() {
    const count = REEF_COLORS.length;
    return Art.image(32, count, 1, (ctx) => {
      REEF_COLORS.forEach((c, raw) => {
        const y = count - 1 - raw;
        ctx.save();
        ctx.beginPath(); ctx.rect(0, y, 32, 1); ctx.clip();
        // Shades 0.15...1 are the normal range; below that is extra depth for baked contact shadows.
        Art.linear(ctx, [c.darker(0.85), c.darker(0.55), c, c.lighter(0.45)], [0, 0.15, 0.62, 1], [0, y], [32, y]);
        ctx.restore();
      });
    });
  }
}

// ---------------------------------------------------------------------------------------------
// Everything that sways (Plants.swift), merged into one mesh: ribbon seaweed, sword plants, stem
// plants, sea anemones and sea fans. Per-vertex sway data travels in the aSway attribute.
// ---------------------------------------------------------------------------------------------

const PlantTone = { green: 0, brightGreen: 1, darkGreen: 2, olive: 3, lime: 4, red: 5, maroon: 6, rotala: 7, anemone: 8, fanPurple: 9, fanRed: 10 };
const PLANT_GRADIENTS = [
  [new RGBA(0.06, 0.26, 0.11), new RGBA(0.16, 0.52, 0.22), new RGBA(0.30, 0.66, 0.30)],
  [new RGBA(0.10, 0.32, 0.10), new RGBA(0.24, 0.62, 0.18), new RGBA(0.50, 0.80, 0.30)],
  [new RGBA(0.03, 0.16, 0.10), new RGBA(0.08, 0.36, 0.22), new RGBA(0.16, 0.48, 0.30)],
  [new RGBA(0.18, 0.24, 0.08), new RGBA(0.36, 0.50, 0.16), new RGBA(0.55, 0.64, 0.26)],
  [new RGBA(0.20, 0.40, 0.08), new RGBA(0.48, 0.74, 0.20), new RGBA(0.72, 0.88, 0.38)],
  [new RGBA(0.25, 0.10, 0.06), new RGBA(0.55, 0.20, 0.16), new RGBA(0.75, 0.32, 0.20)],
  [new RGBA(0.18, 0.05, 0.08), new RGBA(0.40, 0.12, 0.18), new RGBA(0.58, 0.22, 0.28)],
  [new RGBA(0.14, 0.38, 0.14), new RGBA(0.62, 0.52, 0.18), new RGBA(0.92, 0.36, 0.22)],
  [new RGBA(0.45, 0.28, 0.40), new RGBA(0.78, 0.45, 0.62), new RGBA(0.98, 0.82, 0.88)],
  [new RGBA(0.30, 0.12, 0.38), new RGBA(0.52, 0.24, 0.62), new RGBA(0.70, 0.42, 0.80)],
  [new RGBA(0.40, 0.08, 0.10), new RGBA(0.72, 0.18, 0.20), new RGBA(0.92, 0.40, 0.34)],
];
const plantVeined = (tone) => tone < PlantTone.anemone;

class PlantBed {
  constructor() {
    this.mesh = new Mesh();
    this.occluders = [];
    this.smoothedVX = 0;
  }

  uv(tone, u, v) {
    const n = PLANT_GRADIENTS.length;
    return [(tone + 0.08 + clamp(u, 0, 1) * 0.84) / n, 1 - clamp(v, 0.01, 0.99)];
  }

  /** A tall ribbon of seaweed (eelgrass). */
  addBlade(base, height, width, tone) {
    const rows = 14;
    const seed = rnd(0, 10);
    const lean = rnd(-0.12, 0.12) * height;
    const b = new Mesh();
    for (let r = 0; r <= rows; r++) {
      const v = r / rows;
      const half = width / 2 * (1 - Math.pow(v, 3) * 0.95) * (0.85 + 0.15 * Math.sin(v * 9 + seed));
      const cx = width * 0.3 * Math.sin(v * 5 + seed);
      const z = lean * v * v;
      b.p.push(cx - half, v * height, z, cx + half, v * height, z);
      b.addUV(this.uv(tone, 0.1, v));
      b.addUV(this.uv(tone, 0.9, v));
    }
    for (let r = 0; r < rows; r++) b.quad(r * 2, r * 2 + 1, r * 2 + 2, r * 2 + 3);
    this.emit(b, base, height, rnd(0.06, 0.14) * height / 2.5, 0.12, 0.1);
  }

  /** A rosette of broad, arching leaves (Amazon sword; short and wide for an Anubias look). */
  addSword(base, size, leaves, width, tone) {
    const plant = new Mesh();
    let top = 0.01;
    for (let i = 0; i < leaves; i++) {
      const az = i / leaves * TAU + rnd(-0.3, 0.3);
      const rise = rnd(0.55, 1.25);
      const len = size * rnd(0.6, 1.0);
      const leaf = PlantBed.leafMesh(len, width * rnd(0.8, 1.2), rise, len * 0.35, tone, 10, (t, u, v) => this.uv(t, u, v));
      for (let k = 1; k < leaf.p.length; k += 3) top = Math.max(top, leaf.p[k]);
      plant.append(leaf, mat4Rotate(quatAxis(az, 0, 1, 0)));
    }
    this.emit(plant, base, top, 0.04 * top, top * 0.35, size * 0.45);
  }

  /** A tall stem with whorls of small leaves all the way up (Rotala / Ludwigia). */
  addStem(base, height, tone) {
    const plant = new Mesh();
    const seed = rnd(0, 10);
    const lean = v3(rnd(-0.15, 0.15), 0, rnd(-0.15, 0.15)).multiplyScalar(height);
    const stemPoint = (v) => v3(Math.sin(v * 3 + seed) * 0.04, v * height, Math.cos(v * 2.5 + seed) * 0.04).addScaledVector(lean, v * v);
    // Stem: two crossed thin ribbons.
    const rows = 12;
    for (const [dx, dz] of [[1, 0], [0, 1]]) {
      const s = new Mesh();
      for (let r = 0; r <= rows; r++) {
        const v = r / rows;
        const p = stemPoint(v), w = 0.012;
        s.addPos(p.clone().add(v3(-dx * w, 0, -dz * w)));
        s.addPos(p.clone().add(v3(dx * w, 0, dz * w)));
        s.addUV(this.uv(tone, 0.45, v * 0.8));
        s.addUV(this.uv(tone, 0.55, v * 0.8));
      }
      for (let r = 0; r < rows; r++) s.quad(r * 2, r * 2 + 1, r * 2 + 2, r * 2 + 3);
      plant.append(s);
    }
    // Whorls of three leaves, rotating up the stem, smaller near the top.
    let y = 0.1;
    let az = rnd(0, TAU);
    while (y < height * 0.97) {
      const v = y / height;
      for (const side of [0, TAU / 3, 2 * TAU / 3]) {
        const len = (0.22 + 0.08 * Math.sin(v * Math.PI)) * (1 - v * 0.35);
        // Colour follows the plant's height, so red species turn red toward the top.
        const leaf = PlantBed.leafMesh(len, len * 0.34, 0.45, len * 0.25, tone, 5, (t, u) => this.uv(t, u, v));
        plant.append(leaf, mat4Translate(stemPoint(v)).multiply(mat4Rotate(quatAxis(az + side, 0, 1, 0))));
      }
      az += Math.PI / 3 + rnd(-0.2, 0.2);
      y += rnd(0.08, 0.11);
    }
    this.emit(plant, base, height, rnd(0.04, 0.08) * height / 2, 0.15, 0.14);
  }

  /** A sea anemone: a short column with a crown of swaying, tapering tentacles. */
  addAnemone(base, radius) {
    const a = new Mesh();
    const column = radius * 0.5;
    a.append(PlantBed.tube([v3(0, 0, 0), v3(0, column * 0.6, 0), v3(0, column, 0)],
      [radius * 0.55, radius * 0.6, radius * 0.75], 14, (t, u) => this.uv(PlantTone.anemone, u, 0.05 + 0.15 * t)));
    let top = column;
    for (let n = 0; n < 90; n++) {
      const ang = rnd(0, TAU), r = radius * Math.sqrt(rnd(0.05, 1));
      const out = v3(Math.cos(ang), 0, Math.sin(ang));
      const len = radius * rnd(0.8, 1.4);
      const root = v3(0, column, 0).addScaledVector(out, r);
      const dir = unit(out.clone().multiplyScalar(0.25 + r / radius * 0.8).add(v3(0, 1, 0)));
      const pts = [], radii = [];
      for (let k = 0; k <= 5; k++) {
        const t = k / 5;
        pts.push(root.clone().addScaledVector(dir, len * t).addScaledVector(out, len * 0.3 * t * t).add(v3(0, -len * 0.15 * t * t, 0)));
        radii.push(radius * 0.085 * (1 - t * 0.8));
      }
      top = Math.max(top, ...pts.map((p) => p.y));
      a.append(PlantBed.tube(pts, radii, 5, (t, u) => this.uv(PlantTone.anemone, u, 0.3 + 0.7 * t)));
    }
    this.emit(a, base, top, 0.05 * top, top * 0.4, radius * 1.1);
  }

  /** A sea fan (gorgonian): a flat, lacy lattice of thin branches that sways gently. */
  addSeaFan(base, height, angle, tone) {
    const fan = new Mesh();
    const grow = (p, dir, len, radius, depth) => {
      const bend = v3(rnd(-0.25, 0.25), rnd(-0.05, 0.1), 0);
      const mid = p.clone().add(unit(dir.clone().addScaledVector(bend, 0.5)).multiplyScalar(len * 0.5));
      const end = mid.clone().add(unit(dir.clone().add(bend)).multiplyScalar(len * 0.5));
      const t0 = depth / 6, t1 = (depth + 1) / 6;
      fan.append(PlantBed.tube([p, mid, end], [radius, radius * 0.9, radius * 0.8], 4, (t, u) => this.uv(tone, u, t0 + (t1 - t0) * t)));
      if (depth >= 5) return;
      for (const side of [-1, 1]) {
        const spread = rnd(0.25, 0.55) * side;
        const dx = dir.x * Math.cos(spread) - dir.y * Math.sin(spread);
        const dy = dir.x * Math.sin(spread) + dir.y * Math.cos(spread);
        grow(end, unit(v3(dx, Math.max(dy, 0.15), 0)), len * rnd(0.72, 0.85), radius * 0.8, depth + 1);
      }
    };
    grow(v3(), v3(0, 1, 0), height * 0.3, 0.025, 0);
    let top = 0;
    for (let k = 1; k < fan.p.length; k += 3) top = Math.max(top, fan.p[k]);
    for (let k = 0; k < fan.p.length; k++) fan.p[k] *= height / top;
    this.emit(fan, base, height, 0.015 * height, 0.1, 0.1, angle);
  }

  /** Build the merged geometry once all plants have been added. */
  finish() {
    this.mesh.computeNormals();
    const geo = this.mesh.geometry('aSway');
    const mat = new THREE.MeshStandardMaterial({ map: Art.texture(PlantBed.atlas()), roughness: 0.55, metalness: 0, side: THREE.DoubleSide });
    const cfg = {
      key: 'plants',
      uniforms: { ...causticUniforms(), ...swayUniforms() },
      vHead: SWAY_HEAD,
      vMain: 'plantSway(gPos);',
      fHead: CAUSTICS_HEAD,
      fAfterEmissive: CAUSTICS_APPLY('0.4'),
    };
    patchMaterial(mat, cfg);
    this.material = mat;
    this.node = new THREE.Mesh(geo, mat);
    this.node.customDepthMaterial = patchedDepthMaterial(cfg);
    this.node.customDepthMaterial.side = THREE.DoubleSide;
    this.node.castShadow = true;
    this.node.receiveShadow = true;
    this.node.frustumCulled = false;
    this.mesh = null;
  }

  update(dt, tank) {
    const c = tank.cursor;
    const vx = c.present ? c.vel.dx / 100 : 0;
    // Ease the current in and out so plants swing back smoothly after the cursor passes.
    this.smoothedVX += (vx - this.smoothedVX) * Math.min(1, dt * (Math.abs(vx) > Math.abs(this.smoothedVX) ? 10 : 2.5));
    const g = tank.cursorGlassPoint;
    G.curX.value = g.x;
    G.curY.value = g.y;
    G.curVX.value = this.smoothedVX;
    G.eyeDist.value = tank.eyeDistance;
  }

  /** Append a plant built in local space (base at the origin, y up), tagging each vertex with the
   *  data the sway shader needs. */
  emit(plant, base, height, amp, occHeight, occRadius, rotation = rnd(0, TAU)) {
    this.occluders.push(occluder(base.clone().add(v3(0, occHeight, 0)), occRadius, -2));
    const phase = rnd(0, TAU);
    plant.c = [];
    for (let i = 0; i < plant.count; i++) plant.c.push(clamp(plant.p[i * 3 + 1] / height, 0, 1), height, phase, amp);
    plant.n = [];
    this.mesh.append(plant, mat4Translate(base).multiply(mat4Rotate(quatAxis(rotation, 0, 1, 0))));
  }

  /** A lanceolate leaf growing along +x: rises at `rise` radians, then droops; slightly folded. */
  static leafMesh(length, width, rise, droop, tone, rows, uvFn) {
    const m = new Mesh();
    for (let r = 0; r <= rows; r++) {
      const s = r / rows;
      const x = length * s * Math.cos(rise);
      const y = length * s * Math.sin(rise) - droop * s * s;
      const half = width / 2 * Math.pow(Math.sin(Math.PI * Math.min(1, s * 1.05 + 0.02)), 0.8);
      const fold = half * 0.3;
      m.p.push(x, y + fold, -half, x, y, 0, x, y + fold, half);
      m.addUV(uvFn(tone, 0, s));
      m.addUV(uvFn(tone, 0.5, s));
      m.addUV(uvFn(tone, 1, s));
    }
    for (let r = 0; r < rows; r++) {
      const a = r * 3;
      m.quad(a, a + 1, a + 3, a + 4);
      m.quad(a + 1, a + 2, a + 4, a + 5);
    }
    return m;
  }

  /** A tube through `points` with the given radii; `uv(t, u)` maps along (t) and around (u). */
  static tube(points, radii, sides, uv) {
    const m = new Mesh();
    points.forEach((p, k) => {
      const fwd = unit(k + 1 < points.length ? points[k + 1].clone().sub(p) : p.clone().sub(points[k - 1]));
      const side = Math.abs(fwd.y) < 0.9 ? unit(fwd.clone().cross(v3(0, 1, 0))) : unit(fwd.clone().cross(v3(1, 0, 0)));
      const up = side.clone().cross(fwd);
      const t = k / (points.length - 1);
      for (let j = 0; j <= sides; j++) {
        const a = j / sides * TAU;
        const ca = Math.cos(a) * radii[k], sa = Math.sin(a) * radii[k];
        m.p.push(p.x + side.x * ca + up.x * sa, p.y + side.y * ca + up.y * sa, p.z + side.z * ca + up.z * sa);
        m.addUV(uv(t, j / sides));
      }
    });
    for (let k = 0; k < points.length - 1; k++) {
      for (let j = 0; j < sides; j++) {
        const a = k * (sides + 1) + j, b = a + sides + 1;
        m.quad(a, a + 1, b, b + 1);
      }
    }
    return m;
  }

  /** One column per tone: a vertical gradient, with a midrib and side veins for leafy tones. */
  static atlas() {
    const w = 16, h = 128;
    return Art.image(w * PLANT_GRADIENTS.length, h, 2, (ctx) => {
      PLANT_GRADIENTS.forEach(([bottom, mid, top], tone) => {
        const x0 = tone * w;
        ctx.save();
        ctx.beginPath(); ctx.rect(x0, 0, w, h); ctx.clip();
        Art.linear(ctx, [bottom, mid, top], [0, 0.55, 1], [0, 0], [0, h]);
        if (plantVeined(tone)) {
          ctx.strokeStyle = mid.lighter(0.45).alpha(0.4).css;
          ctx.lineWidth = 1.2;
          ctx.beginPath(); ctx.moveTo(x0 + w / 2, 0); ctx.lineTo(x0 + w / 2, h); ctx.stroke();
          ctx.strokeStyle = mid.lighter(0.3).alpha(0.18).css;
          ctx.lineWidth = 0.6;
          ctx.beginPath();
          for (let j = 0; j < 14; j++) {
            const y = j * 9 + 4;
            ctx.moveTo(x0 + w / 2, y); ctx.lineTo(x0 + 1, y + 6);
            ctx.moveTo(x0 + w / 2, y); ctx.lineTo(x0 + w - 1, y + 6);
          }
          ctx.stroke();
        }
        ctx.restore();
      });
    });
  }
}
// ---------------------------------------------------------------------------------------------
// Lighting (Lighting.swift): by day sunlight comes down through the surface; at night the tank
// goes dark apart from a lamp above the water that swivels to aim at the cursor, with a visible
// beam and caustics only inside its cone. Switching fades over ~2 s.
// ---------------------------------------------------------------------------------------------

/** SceneKit physically based light intensities (1000 = "normal") → three.js intensities. */
const LIGHT_K = Math.PI / 1000;
const DAY_WATER = new RGBA(0.035, 0.2, 0.29);
const NIGHT_WATER = new RGBA(0.004, 0.022, 0.045);
const SUN_DIR = v3(0.073, 0.955, 0.287).normalize();

class Lighting {
  constructor(tank, night) {
    const { scene, surfaceY, depth } = tank;
    const floorY = tank.floorHeight(0, -depth * 0.45);
    this.night = night ? 1 : 0;
    this.spotHeight = 5;
    this.spotHalfAngle = 16 * Math.PI / 180;
    this.spotPosition = v3(0, surfaceY + this.spotHeight, -depth * 0.45);
    this.spotTarget = v3(0, (surfaceY + floorY) / 2, this.spotPosition.z);
    this.floorY = floorY;
    this.surfaceY = surfaceY;
    this.lastApplied = -1;
    this.sentTarget = v3(NaN, NaN, NaN);

    // Sunlight from above casting shadows, a soft fill from the viewer, blue ambient.
    this.sun = new THREE.DirectionalLight(0xffffff, 1);
    this.sun.castShadow = true;
    this.sun.shadow.mapSize.set(2048, 2048);
    this.sun.shadow.intensity = 0.5;
    this.sun.shadow.bias = -0.0005;
    this.sun.shadow.normalBias = 0.02;
    this.fitSunShadow(tank);
    scene.add(this.sun, this.sun.target);

    this.fill = new THREE.DirectionalLight(new RGBA(0.6, 0.85, 0.95).color, 450 * LIGHT_K);
    this.fill.position.set(0, Math.sin(0.35), Math.cos(0.35)).multiplyScalar(10);
    scene.add(this.fill, this.fill.target);

    this.ambient = new THREE.AmbientLight(0xffffff, 1);
    scene.add(this.ambient);

    // The night spotlight, hanging above the water: fully lit in the middle of the beam, fading
    // out a little beyond its visible edge.
    this.spot = new THREE.SpotLight(new RGBA(1.0, 0.94, 0.82).color, 0, 0, this.spotHalfAngle * 1.35, 1 - 0.3 / 1.35, 0);
    this.spot.position.copy(this.spotPosition);
    this.spot.castShadow = false;
    this.spot.shadow.mapSize.set(2048, 2048);
    this.spot.shadow.intensity = 0.7;
    this.spot.shadow.bias = -0.0005;
    this.spot.shadow.normalBias = 0.02;
    this.spot.shadow.camera.near = 1;
    this.spot.shadow.camera.far = (this.spotHeight + surfaceY - floorY) * 1.5;
    scene.add(this.spot, this.spot.target);

    // A soft visible beam: a long cone with its tip at the lamp.
    const beamLength = 32;
    this.beamMaterial = beamMaterial();
    this.beamMaterial.uniforms.beamTop.value = surfaceY;
    this.beamMaterial.uniforms.beamBottom.value = floorY;
    const cone = new THREE.Mesh(new THREE.ConeGeometry(beamLength * Math.tan(this.spotHalfAngle), beamLength, 64, 1, true), this.beamMaterial);
    cone.position.y = -beamLength / 2;
    cone.frustumCulled = false;
    this.beamPivot = new THREE.Group();
    this.beamPivot.position.copy(this.spotPosition);
    this.beamPivot.add(cone);
    scene.add(this.beamPivot);

    G.spotPos.value.copy(this.spotPosition);
    // A little wider than the beam so light fades out softly past its visible edge.
    G.spotCos.value = Math.cos(this.spotHalfAngle * 1.3);
    this.aim();
  }

  /** Fit the sun's orthographic shadow camera around the part of the tank near the camera. */
  fitSunShadow(tank) {
    const zFar = -tank.depth - 2, zNear = tank.frontZ + 1;
    const hw = tank.halfWidth(zFar) + 1;
    const center = v3(0, 0, (zFar + zNear) / 2);
    this.sun.position.copy(center).addScaledVector(SUN_DIR, 40);
    this.sun.target.position.copy(center);
    const view = new THREE.Matrix4().lookAt(this.sun.position, center, v3(0, 1, 0));
    view.setPosition(this.sun.position);
    view.invert();
    const box = new THREE.Box3();
    for (const x of [-hw, hw]) for (const y of [tank.floorBase - 1, tank.surfaceY + 1]) for (const z of [zFar, zNear]) {
      box.expandByPoint(v3(x, y, z).applyMatrix4(view));
    }
    const cam = this.sun.shadow.camera;
    cam.left = box.min.x; cam.right = box.max.x;
    cam.bottom = box.min.y; cam.top = box.max.y;
    cam.near = Math.max(0.1, -box.max.z - 1);
    cam.far = -box.min.z + 1;
    cam.updateProjectionMatrix();
  }

  /** Point the light and beam from the lamp toward `spotTarget`. */
  aim() {
    const dir = unit(this.spotTarget.clone().sub(this.spotPosition));
    this.spot.target.position.copy(this.spotTarget);
    this.beamPivot.quaternion.copy(quatFromTo(v3(0, -1, 0), dir));
  }

  /** A point along the beam at height y, for fish drawn to the light. */
  pointInBeam(y) {
    const dir = unit(this.spotTarget.clone().sub(this.spotPosition));
    const t = (y - this.spotPosition.y) / Math.min(dir.y, -0.05);
    return this.spotPosition.clone().addScaledVector(dir, t);
  }

  /** Caustic and fin-glow multiplier for fish (neither makes sense in the dark). */
  get fishCausticScale() { return Math.round((1 - this.night) / 0.1) * 0.1; }

  update(dt, tank, nightMode) {
    const target = nightMode ? 1 : 0;
    this.night += clamp(target - this.night, -dt * 0.5, dt * 0.5);

    // Aim at the cursor: the point on the cursor's line of sight in the lamp's depth plane.
    if (this.night > 0 && tank.cursor.present) {
      const z = this.spotPosition.z;
      const g = tank.cursorGlassPoint;
      const f = (tank.eyeDistance - z) / tank.eyeDistance;
      const hw = tank.halfWidth(z);
      const goal = v3(clamp(g.x * f, -hw, hw), clamp(g.y * f, this.floorY + 0.2, this.surfaceY - 0.4), z);
      if (goal.distanceTo(this.spotTarget) > 0.002) {
        this.spotTarget.lerp(goal, Math.min(1, dt * 5));
        this.aim();
      }
    }
    if (this.night > 0 && !(this.spotTarget.distanceTo(this.sentTarget) < 0.003)) {
      this.sentTarget.copy(this.spotTarget);
      G.spotT.value.set(this.spotTarget.x, this.spotTarget.y);
    }
    if (this.night === this.lastApplied) return;
    this.lastApplied = this.night;
    this.applyBlend(tank);
  }

  applyBlend(tank) {
    const n = this.night;
    this.sun.intensity = lerp(1500, 60, n) * LIGHT_K;
    this.sun.color.copy(new RGBA(0.85, 0.96, 1.0).mix(new RGBA(0.5, 0.65, 1.0), n).color);
    this.fill.intensity = lerp(450, 15, n) * LIGHT_K;
    this.ambient.intensity = lerp(250, 45, n) * LIGHT_K;
    this.ambient.color.copy(new RGBA(0.25, 0.5, 0.6).mix(new RGBA(0.1, 0.2, 0.4), n).color);
    this.spot.intensity = lerp(0, 3200, n) * LIGHT_K;
    // Toggling shadows recompiles shaders, so only flip them at the ends of the fade.
    if (n <= 0 || n >= 1) {
      this.spot.castShadow = n > 0;
      this.sun.castShadow = n < 1;
    } else {
      this.spot.castShadow = true;
      this.sun.castShadow = true;
    }
    this.beamMaterial.uniforms.beamStrength.value = 0.09 * n;
    this.beamPivot.visible = n > 0;

    const water = DAY_WATER.mix(NIGHT_WATER, n).color;
    tank.scene.fog.color.copy(water);
    tank.scene.background.copy(water);
    tank.scene.environmentIntensity = lerp(0.9, 0.1, n);
    G.causticNight.value = n;
    tank.overlay.setSkyGlow(1 - n * 0.9);
    tank.applyFishCaustics(this.fishCausticScale);
  }
}

// ---------------------------------------------------------------------------------------------
// The cursor in screen points (y up, origin bottom-left), with smoothed velocity
// ---------------------------------------------------------------------------------------------

class Cursor {
  constructor() {
    this.screen = { x: -10000, y: -10000 };
    this.present = false;
    this.vel = { dx: 0, dy: 0 };
    this.speed = 0;
    this.stillTime = 0;
  }

  update(p, inside, dt) {
    if (inside && this.present && dt > 0) {
      const vx = (p.x - this.screen.x) / dt, vy = (p.y - this.screen.y) / dt;
      this.vel = { dx: this.vel.dx + (vx - this.vel.dx) * 0.35, dy: this.vel.dy + (vy - this.vel.dy) * 0.35 };
    } else {
      this.vel = { dx: 0, dy: 0 };
    }
    this.present = inside;
    this.screen = { x: p.x, y: p.y };
    this.speed = Math.hypot(this.vel.dx, this.vel.dy);
    this.stillTime = this.speed < 25 ? this.stillTime + dt : 0;
  }
}

// ---------------------------------------------------------------------------------------------
// 2D layer over the 3D view (Tank.swift Overlay): a soft glow of light from above, reflections on
// the glass, and ripples where the cursor stirs. Plain DOM, blended additively.
// ---------------------------------------------------------------------------------------------

class Overlay {
  constructor(el) {
    this.el = el;
    el.innerHTML = '';
    Overlay.ringURL ??= Art.ring().toDataURL();
    Overlay.streakURL ??= Art.glassStreak().toDataURL();
    this.sky = document.createElement('div');
    this.sky.className = 'fx-sky';
    el.appendChild(this.sky);
    for (const [x, w, a] of [[0.05, 0.035, 0.06], [0.095, 0.01, 0.045], [0.93, 0.02, 0.035]]) {
      const s = document.createElement('div');
      s.className = 'fx-streak';
      s.style.left = `${(x - w / 2) * 100}%`;
      s.style.width = `${w * 100}%`;
      s.style.opacity = a;
      s.style.backgroundImage = `url(${Overlay.streakURL})`;
      el.appendChild(s);
    }
  }

  setSkyGlow(amount) { this.sky.style.opacity = amount; }

  /** `p` in screen points, y up. */
  ripple(p, scale, height) {
    const ring = document.createElement('img');
    ring.src = Overlay.ringURL;
    ring.className = 'fx-ring';
    ring.style.left = `${p.x - 60}px`;
    ring.style.top = `${height - p.y - 60}px`;
    this.el.appendChild(ring);
    const anim = ring.animate([
      { transform: 'scale(0.15)', opacity: 0.14 },
      { transform: `scale(${scale})`, opacity: 0 },
    ], { duration: 800, easing: 'linear' });
    anim.onfinish = () => ring.remove();
  }
}

// ---------------------------------------------------------------------------------------------
// The tank (Tank.swift). World layout: 1 unit = 100 screen points. The front glass is the plane
// z = 0 and exactly fills the view; the tank extends back to z = -depth. The camera sits in front
// of the glass on +z, so any screen point maps to a point on the glass and a ray into the tank.
// ---------------------------------------------------------------------------------------------

class Tank {
  constructor(app, screenW, screenH) {
    this.app = app;
    this.screenW = screenW;
    this.screenH = screenH;
    this.width = screenW / 100;
    this.height = screenH / 100;
    this.depth = clamp(this.height * 1.0, 6, 12);
    const fov = 40;
    this.eyeDistance = (this.height / 2) / Math.tan(fov / 2 * Math.PI / 180);
    // No menu bar in a browser.
    this.menuBar = 0;
    this.surfaceY = this.height / 2 - this.menuBar * 0.3;
    this.floorBase = -this.height / 2 + 0.3;

    this.fish = [];
    this.shark = null;
    this.respawns = [];
    this.food = [];
    this.obstacles = [];
    this.anemoneTop = null;
    this.schoolGoals = {};
    this.cursor = new Cursor();
    this.clock = 0;
    this.rippleTimer = 0;
    this.shafts = [];
    this.tweens = [];
    this.textures = [];
    this.cameraAngles = new THREE.Vector2();
    this.cameraTurn = new THREE.Quaternion();
    this.cameraTurnInverse = new THREE.Quaternion();

    this.overlay = new Overlay(app.fxEl);
    this.scene = new THREE.Scene();
    this.camera = new THREE.PerspectiveCamera(fov, screenW / screenH, 0.5, this.eyeDistance + this.depth + 30);
    this.camera.position.set(0, 0, this.eyeDistance);
    this.scene.add(this.camera);

    // Water: backdrop exactly the fog colour so distant sand dissolves seamlessly, and a matching
    // environment for reflections. The haze only turns opaque well behind the tank, leaving room
    // for the shark to lurk as a fading shape.
    this.scene.background = DAY_WATER.color;
    this.scene.fog = new THREE.Fog(this.scene.background.clone(), this.eyeDistance + 1, this.eyeDistance + this.depth + 14);
    this.scene.environment = app.environment;

    this.lighting = new Lighting(this, app.settings.nightMode);
    G.eyeDist.value = this.eyeDistance;

    // Scenery first: the sand bakes its contact shadows from what's standing on it.
    const occluders = this.buildScenery();
    this.buildSand(occluders);
    this.buildShafts();
    this.buildParticles();
    this.populate();
    this.lighting.update(0, this, app.settings.nightMode);
  }

  // MARK: - Geometry helpers

  floorHeight(x, z) {
    // Gentle dunes, sloping up toward the back like a real aquascape.
    return this.floorBase + 0.12 * Math.sin(x * 0.45 + 0.7) + 0.08 * Math.sin(x * 1.1 + z * 0.6 + 2.1)
      + 0.06 * Math.sin(z * 0.9 + x * 0.2) - z * 0.07;
  }

  /** Half the visible width of the tank at depth z (the view frustum widens toward the back). */
  halfWidth(z) { return this.width / 2 * (this.eyeDistance - z) / this.eyeDistance; }
  halfHeight(z) { return this.height / 2 * (this.eyeDistance - z) / this.eyeDistance; }
  /** How far in front of the screen plane (toward the camera) fish may swim. */
  get frontZ() { return this.eyeDistance * 0.35; }

  /** Where a fish may be at depth p.z: inside the tank and inside what the camera can see there. */
  bounds(p, bodyLength) {
