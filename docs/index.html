<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ---------------------------------------------------------------------------------------------
// Math helpers (Math.swift)
// ---------------------------------------------------------------------------------------------

const TAU = Math.PI * 2;
const clamp = (x, lo, hi) => Math.min(Math.max(x, lo), hi);
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (lo, hi) => lo + Math.random() * (hi - lo);
/** Random integer in lo...hi (inclusive, like Swift's `Int.random(in: lo...hi)`). */
const randInt = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
const coin = () => Math.random() < 0.5;
const pick = (a) => a[Math.floor(Math.random() * a.length)];

function smoothstep(e0, e1, x) {
  const t = clamp((x - e0) / (e1 - e0), 0, 1);
  return t * t * (3 - 2 * t);
}

/** Shortest signed difference between two angles. */
function angleDelta(a, b) {
  let d = a - b;
  while (d > Math.PI) d -= TAU;
  while (d < -Math.PI) d += TAU;
  return d;
}

const v3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
/** Normalised copy, or zero for (near) zero vectors. */
function unit(v) {
  const l = v.length();
  return l > 1e-5 ? v.clone().divideScalar(l) : v3();
}
const quatAxis = (angle, x, y, z) => new THREE.Quaternion().setFromAxisAngle(v3(x, y, z), angle);
const quatFromTo = (a, b) => new THREE.Quaternion().setFromUnitVectors(unit(a), unit(b));

// ---------------------------------------------------------------------------------------------
// Colour (Art.swift RGBA): sRGB values that are easy to mix
// ---------------------------------------------------------------------------------------------

class RGBA {
  constructor(r, g, b, a = 1) { this.r = r; this.g = g; this.b = b; this.a = a; }
  alpha(x) { return new RGBA(this.r, this.g, this.b, x); }
  mix(o, t) { return new RGBA(lerp(this.r, o.r, t), lerp(this.g, o.g, t), lerp(this.b, o.b, t), lerp(this.a, o.a, t)); }
  darker(t) { return this.mix(RGBA.black, t).alpha(this.a); }
  lighter(t) { return this.mix(RGBA.white, t).alpha(this.a); }
  get css() {
    const f = (x) => Math.round(clamp(x, 0, 1) * 255);
    return `rgba(${f(this.r)},${f(this.g)},${f(this.b)},${clamp(this.a, 0, 1)})`;
  }
  /** As a three.js colour (converted to the linear working space). */
  get color() { return new THREE.Color().setRGB(this.r, this.g, this.b, THREE.SRGBColorSpace); }
}
RGBA.white = new RGBA(1, 1, 1);
RGBA.black = new RGBA(0, 0, 0);
RGBA.clear = new RGBA(0, 0, 0, 0);

// ---------------------------------------------------------------------------------------------
// Procedural images (Art.swift). Drawing uses Core Graphics conventions: points, origin at the
// bottom-left, y up. Textures are uploaded with flipY = false so UVs match SceneKit's (v = 0 at
// the top of the image).
// ---------------------------------------------------------------------------------------------

const Art = {
  /** Images are rendered at 4 pixels per point so fish stay crisp up close to the glass. */
  scale: 4,

  image(w, h, scale, draw) {
    const pw = Math.max(1, Math.ceil(w * scale));
    const ph = Math.max(1, Math.ceil(h * scale));
    const c = document.createElement('canvas');
    c.width = pw;
    c.height = ph;
    const ctx = c.getContext('2d');
    ctx.setTransform(scale, 0, 0, -scale, 0, ph);
    ctx.imageSmoothingQuality = 'high';
    draw(ctx);
    return c;
  },

  gradientStops(g, colors, locations) {
    colors.forEach((c, i) => g.addColorStop(locations ? locations[i] : i / (colors.length - 1), c.css));
    return g;
  },

  /** Fills the current clip with a linear gradient (extended past both ends). */
  linear(ctx, colors, locations, from, to) {
    ctx.fillStyle = Art.gradientStops(ctx.createLinearGradient(from[0], from[1], to[0], to[1]), colors, locations);
    ctx.fillRect(-1e4, -1e4, 2e4, 2e4);
  },

  /** A radial gradient, drawn only out to its radius (as Core Graphics does). */
  radial(ctx, colors, locations, center, radius) {
    ctx.fillStyle = Art.gradientStops(ctx.createRadialGradient(center[0], center[1], 0, center[0], center[1], radius),
      colors, locations);
    ctx.beginPath();
    ctx.arc(center[0], center[1], radius, 0, TAU);
    ctx.fill();
  },

  /** A 1-pixel-tall strip of flat colours. Meshes pick a colour with `paletteUV`. */
  palette(colors) {
    return Art.image(colors.length, 1, 1, (ctx) => {
      colors.forEach((c, i) => { ctx.fillStyle = c.css; ctx.fillRect(i, 0, 1, 1); });
    });
  },
  paletteUV: (index, count) => [(index + 0.5) / count, 0.5],

  texture(canvas, { srgb = true, repeat = false, mipmaps = true, premultiplied = false, nearest = false } = {}) {
    const t = new THREE.CanvasTexture(canvas);
    t.flipY = false;
    t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
    if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.generateMipmaps = mipmaps;
    t.minFilter = nearest ? THREE.NearestFilter : (mipmaps ? THREE.LinearMipmapLinearFilter : THREE.LinearFilter);
    t.magFilter = nearest ? THREE.NearestFilter : THREE.LinearFilter;
    t.premultiplyAlpha = premultiplied;
    t.anisotropy = 4;
    return t;
  },
};

/** Vertical water gradient used for the image-based lighting. */
Art.waterGradient = (w, h) => Art.image(w, h, 1, (ctx) => {
  Art.linear(ctx, [new RGBA(0.012, 0.06, 0.11), new RGBA(0.03, 0.19, 0.27), new RGBA(0.05, 0.28, 0.37), new RGBA(0.14, 0.52, 0.62)],
    [0, 0.45, 0.62, 1], [0, 0], [0, h]);
});

/** Tileable-ish sand: mottled base with scattered grains. */
Art.sand = () => Art.image(512, 512, 1, (ctx) => {
  ctx.fillStyle = new RGBA(0.66, 0.58, 0.42).css;
  ctx.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 260; i++) {
    const r = rnd(10, 60);
    const c = [rnd(0, 512), rnd(0, 512)];
    const tone = coin() ? new RGBA(0.80, 0.71, 0.53, 0.18) : new RGBA(0.45, 0.38, 0.27, 0.18);
    Art.radial(ctx, [tone, tone.alpha(0)], null, c, r);
  }
  const tones = [new RGBA(0.9, 0.84, 0.7), new RGBA(0.35, 0.3, 0.24), new RGBA(0.75, 0.62, 0.45), new RGBA(0.95, 0.95, 0.92)];
  for (let i = 0; i < 9000; i++) {
    const s = rnd(0.8, 2.4);
    ctx.fillStyle = pick(tones).alpha(rnd(0.25, 0.7)).css;
    ctx.beginPath();
    ctx.ellipse(rnd(0, 512) + s / 2, rnd(0, 512) + s / 2, s / 2, s / 2, 0, 0, TAU);
    ctx.fill();
  }
});

/** Soft vertical beam of light, brightest at the top. */
Art.lightShaft = () => Art.image(64, 256, 1, (ctx) => {
  Art.linear(ctx, [RGBA.clear, new RGBA(1, 1, 1, 1), RGBA.clear], [0, 0.5, 1], [0, 0], [64, 0]);
  ctx.globalCompositeOperation = 'destination-in';
  Art.linear(ctx, [RGBA.clear, new RGBA(1, 1, 1, 0.35), RGBA.white], [0, 0.45, 1], [0, 0], [0, 256]);
});

/** Ripple ring for the glass overlay. */
Art.ring = () => Art.image(128, 128, 2, (ctx) => {
  ctx.strokeStyle = new RGBA(0.85, 1, 1, 0.9).css;
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.ellipse(64, 64, 60, 60, 0, 0, TAU); ctx.stroke();
  ctx.strokeStyle = new RGBA(0.85, 1, 1, 0.35).css;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(64, 64, 50, 50, 0, 0, TAU); ctx.stroke();
});

/** A soft vertical streak used to suggest light reflecting on the glass. */
Art.glassStreak = () => Art.image(64, 256, 2, (ctx) => {
  Art.linear(ctx, [RGBA.clear, new RGBA(1, 1, 1, 1), new RGBA(1, 1, 1, 0.6), RGBA.clear], [0, 0.35, 0.6, 1], [0, 0], [64, 0]);
  ctx.globalCompositeOperation = 'destination-in';
  Art.linear(ctx, [RGBA.clear, RGBA.white, RGBA.white, RGBA.clear], [0, 0.25, 0.75, 1], [0, 0], [0, 256]);
});

// ---------------------------------------------------------------------------------------------
// Procedural normal maps (Detail.swift), each generated once from a tileable height field
// ---------------------------------------------------------------------------------------------

const Detail = {
  /** Tileable value noise: lattice values repeat every `period` cells across the 0...1 square. */
  noise(u, v, period, seed) {
    const x = u * period, y = v * period;
    const xi = Math.floor(x), yi = Math.floor(y);
    const fx = x - xi, fy = y - yi;
    const lattice = (i, j) => {
      let h = Math.imul(((i % period) + period) % period, 374761393) >>> 0;
      h = (h + Math.imul(((j % period) + period) % period, 668265263) + Math.imul(seed, 2147483647)) >>> 0;
      h = Math.imul(h ^ (h >>> 13), 1274126177) >>> 0;
      return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
    };
    const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
    const a = lattice(xi, yi), b = lattice(xi + 1, yi), c = lattice(xi, yi + 1), d = lattice(xi + 1, yi + 1);
    return (a + (b - a) * sx) * (1 - sy) + (c + (d - c) * sx) * sy;
  },

  /** Fractal (multi-octave) tileable noise in roughly 0...1. */
  fbm(u, v, period, octaves, seed) {
    let sum = 0, amp = 0.5, total = 0, p = period;
    for (let o = 0; o < octaves; o++) {
      sum += Detail.noise(u, v, p, seed + o) * amp;
      total += amp;
      amp *= 0.5;
      p *= 2;
    }
    return sum / total;
  },

  /** Encode the slopes of a tileable height field as a tangent-space normal map. */
  normalMap(n, strength, h) {
    const heights = new Float32Array(n * n);
    for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) heights[j * n + i] = h(i / n, j / n);
    const bytes = new Uint8Array(n * n * 4);
    for (let j = 0; j < n; j++) {
      for (let i = 0; i < n; i++) {
        const l = heights[j * n + (i + n - 1) % n], r = heights[j * n + (i + 1) % n];
        const d = heights[((j + 1) % n) * n + i], u = heights[((j + n - 1) % n) * n + i];
        let x = (l - r) * strength, y = (d - u) * strength, z = 1;
        const len = Math.hypot(x, y, z);
        x /= len; y /= len; z /= len;
        const k = (j * n + i) * 4;
        bytes[k] = clamp((x * 0.5 + 0.5) * 255, 0, 255);
        bytes[k + 1] = clamp((y * 0.5 + 0.5) * 255, 0, 255);
        bytes[k + 2] = clamp((z * 0.5 + 0.5) * 255, 0, 255);
        bytes[k + 3] = 255;
      }
    }
    const t = new THREE.DataTexture(bytes, n, n, THREE.RGBAFormat, THREE.UnsignedByteType);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.generateMipmaps = true;
    t.minFilter = THREE.LinearMipmapLinearFilter;
    t.magFilter = THREE.LinearFilter;
    t.anisotropy = 4;
    t.colorSpace = THREE.NoColorSpace;
    t.needsUpdate = true;
    return t;
  },
};

let _detailCache = {};
/** Sand: gentle ripple bars across the floor plus fine grain. Tiles every 2.5 world units. */
Detail.sand = () => _detailCache.sand ??= Detail.normalMap(512, 5, (u, v) => {
  const warp = Detail.fbm(u, v, 4, 3, 3);
  const phase = (v * 14 + warp * 1.6) * TAU;
  const ripple = Math.pow(0.5 + 0.5 * Math.sin(phase), 1.6) * 0.6;
  const grain = Detail.fbm(u, v, 64, 2, 11) * 0.35;
  return ripple + grain;
});

/** Rock and coral: pitted, porous bumps. Projected onto the reef from three directions. */
Detail.rock = () => _detailCache.rock ??= Detail.normalMap(256, 7, (u, v) => {
  const bumps = Detail.fbm(u, v, 6, 4, 5);
  const pores = 0.6 * Detail.fbm(u, v, 24, 2, 9) + 0.4 * Detail.fbm(u, v, 40, 1, 13);
  return bumps - 0.5 * smoothstep(0.6, 0.78, pores);
});

/** Fish scales: overlapping domes in offset columns (8 columns x 10 rows per tile). */
Detail.scales = () => _detailCache.scales ??= Detail.normalMap(256, 3, (u, v) => {
  const cols = 8, rows = 10;
  const x = u * cols, y = v * rows;
  let best = -1, height = 0;
  const ci = Math.floor(x);
  for (let dc = -1; dc <= 1; dc++) {
    const c = ci + dc;
    const offset = ((c % 2) + 2) % 2 === 0 ? 0 : 0.5;
    const ri = Math.floor(y - offset);
    for (let dr = -1; dr <= 1; dr++) {
      const cx = c + 0.5, cy = ri + dr + offset + 0.5;
      const d = Math.hypot(x - cx, (y - cy) * 0.8);
      if (d < 0.85 && cx > best) {
        best = cx;
        height = 1 - (d / 0.85) * (d / 0.85);
      }
    }
  }
  return height;
});

// ---------------------------------------------------------------------------------------------
// Minimal indexed triangle mesh (Mesh.swift)
// ---------------------------------------------------------------------------------------------

class Mesh {
  constructor() {
    this.p = [];    // positions, flat xyz
    this.n = [];    // normals, flat xyz
    this.uv = [];   // flat uv
    this.uv2 = [];  // optional second uv set
    this.c = [];    // optional per-vertex data, flat xyzw
    this.idx = [];
  }

  get count() { return this.p.length / 3; }
  pos(i) { return v3(this.p[i * 3], this.p[i * 3 + 1], this.p[i * 3 + 2]); }
  setPos(i, v) { this.p[i * 3] = v.x; this.p[i * 3 + 1] = v.y; this.p[i * 3 + 2] = v.z; }
  addPos(v) { this.p.push(v.x, v.y, v.z); }
  addUV(uv) { this.uv.push(uv[0], uv[1]); }
  triangle(a, b, c) { this.idx.push(a, b, c); }
  /** Two triangles for the quad a-b (bottom edge) / c-d (top edge). */
  quad(a, b, c, d) { this.triangle(a, b, c); this.triangle(b, d, c); }

  mapPositions(f) {
    for (let i = 0; i < this.count; i++) this.setPos(i, f(this.pos(i), i));
    return this;
  }
  scaled(k) {
    const m = this.clone();
    for (let i = 0; i < m.p.length; i++) m.p[i] *= k;
    return m;
  }
  clone() {
    const m = new Mesh();
    m.p = this.p.slice(); m.n = this.n.slice(); m.uv = this.uv.slice(); m.uv2 = this.uv2.slice();
    m.c = this.c.slice(); m.idx = this.idx.slice();
    return m;
  }

  /** Merge another mesh into this one, transforming its positions and normals by a Matrix4. */
  append(o, t = null) {
    const base = this.count;
    if (t) {
      const e = t.elements;
      for (let i = 0; i < o.p.length; i += 3) {
        const x = o.p[i], y = o.p[i + 1], z = o.p[i + 2];
        this.p.push(e[0] * x + e[4] * y + e[8] * z + e[12], e[1] * x + e[5] * y + e[9] * z + e[13], e[2] * x + e[6] * y + e[10] * z + e[14]);
      }
      for (let i = 0; i < o.n.length; i += 3) {
        const x = o.n[i], y = o.n[i + 1], z = o.n[i + 2];
        let nx = e[0] * x + e[4] * y + e[8] * z, ny = e[1] * x + e[5] * y + e[9] * z, nz = e[2] * x + e[6] * y + e[10] * z;
        const l = Math.hypot(nx, ny, nz) || 1;
        this.n.push(nx / l, ny / l, nz / l);
      }
    } else {
      for (const x of o.p) this.p.push(x);
      for (const x of o.n) this.n.push(x);
    }
    for (const x of o.uv) this.uv.push(x);
    for (const x of o.c) this.c.push(x);
    for (const i of o.idx) this.idx.push(i + base);
  }

  /** Smooth normals from the area-weighted face normals (counter-clockwise = front). */
  computeNormals() {
    const n = new Float32Array(this.p.length);
    const p = this.p, idx = this.idx;
    for (let i = 0; i < idx.length; i += 3) {
      const a = idx[i] * 3, b = idx[i + 1] * 3, c = idx[i + 2] * 3;
      const ux = p[b] - p[a], uy = p[b + 1] - p[a + 1], uz = p[b + 2] - p[a + 2];
      const vx = p[c] - p[a], vy = p[c + 1] - p[a + 1], vz = p[c + 2] - p[a + 2];
      const fx = uy * vz - uz * vy, fy = uz * vx - ux * vz, fz = ux * vy - uy * vx;
      n[a] += fx; n[a + 1] += fy; n[a + 2] += fz;
      n[b] += fx; n[b + 1] += fy; n[b + 2] += fz;
      n[c] += fx; n[c + 1] += fy; n[c + 2] += fz;
    }
    this.n = new Array(n.length);
    for (let i = 0; i < n.length; i += 3) {
      const l = Math.hypot(n[i], n[i + 1], n[i + 2]);
      if (l > 1e-8) { this.n[i] = n[i] / l; this.n[i + 1] = n[i + 1] / l; this.n[i + 2] = n[i + 2] / l; }
      else { this.n[i] = 0; this.n[i + 1] = 1; this.n[i + 2] = 0; }
    }
  }

  /** `dataName` names the attribute the per-vertex data (`c`) goes to. */
  geometry(dataName = 'aData') {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(this.p, 3));
    if (this.n.length === this.p.length) g.setAttribute('normal', new THREE.Float32BufferAttribute(this.n, 3));
    if (this.uv.length) g.setAttribute('uv', new THREE.Float32BufferAttribute(this.uv, 2));
    if (this.uv2.length) g.setAttribute('aUV2', new THREE.Float32BufferAttribute(this.uv2, 2));
    if (this.c.length) g.setAttribute(dataName, new THREE.Float32BufferAttribute(this.c, 4));
    g.setIndex(this.count > 65535 ? new THREE.Uint32BufferAttribute(this.idx, 1) : new THREE.Uint16BufferAttribute(this.idx, 1));
    g.computeBoundingSphere();
    return g;
  }

  /** Unit icosphere (radius 1) with the given number of subdivisions. */
  static icosphere(subdivisions) {
    const t = (1 + Math.sqrt(5)) / 2;
    const p = [[-1, t, 0], [1, t, 0], [-1, -t, 0], [1, -t, 0], [0, -1, t], [0, 1, t], [0, -1, -t], [0, 1, -t],
      [t, 0, -1], [t, 0, 1], [-t, 0, -1], [-t, 0, 1]].map(([x, y, z]) => v3(x, y, z).normalize());
    let faces = [[0, 11, 5], [0, 5, 1], [0, 1, 7], [0, 7, 10], [0, 10, 11], [1, 5, 9], [5, 11, 4], [11, 10, 2], [10, 7, 6], [7, 1, 8],
      [3, 9, 4], [3, 4, 2], [3, 2, 6], [3, 6, 8], [3, 8, 9], [4, 9, 5], [2, 4, 11], [6, 2, 10], [8, 6, 7], [9, 8, 1]];
    for (let s = 0; s < subdivisions; s++) {
      const cache = new Map();
      const mid = (a, b) => {
        const key = Math.min(a, b) * 100000 + Math.max(a, b);
        const hit = cache.get(key);
        if (hit !== undefined) return hit;
        p.push(p[a].clone().add(p[b]).multiplyScalar(0.5).normalize());
        cache.set(key, p.length - 1);
        return p.length - 1;
      };
      const next = [];
      for (const [a, b, c] of faces) {
        const ab = mid(a, b), bc = mid(b, c), ca = mid(c, a);
        next.push([a, ab, ca], [b, bc, ab], [c, ca, bc], [ab, bc, ca]);
      }
      faces = next;
    }
    const m = new Mesh();
    for (const v of p) m.addPos(v);
    for (const [a, b, c] of faces) m.triangle(a, b, c);
    m.computeNormals();
    return m;
  }
}

const mat4Translate = (v) => new THREE.Matrix4().makeTranslation(v.x, v.y, v.z);
const mat4Rotate = (q) => new THREE.Matrix4().makeRotationFromQuaternion(q);

// ---------------------------------------------------------------------------------------------
// Baked contact shadows (Occlusion.swift). Scenery never moves, so this is computed once.
// ---------------------------------------------------------------------------------------------

const Occlusion = {
  /** How much light reaches point `p` (normal `n`): 1 = fully open, lower = tucked in. */
  visibility(px, py, pz, nx, ny, nz, occluders, ignoring, strength) {
    let vis = 1;
    for (const o of occluders) {
      if (o.piece === ignoring) continue;
      const dx = o.cx - px, dy = o.cy - py, dz = o.cz - pz;
      const d2 = dx * dx + dy * dy + dz * dz;
      const r2 = o.radius * o.radius;
      if (d2 > r2 * 16) continue;
      const dist = Math.sqrt(d2);
      const inv = 1 / Math.max(dist, 1e-4);
      const facing = 0.35 + 0.65 * Math.max(0, (nx * dx + ny * dy + nz * dz) * inv);
      const occ = Math.min(1, r2 / Math.max(d2, r2 * 0.25)) * facing;
      vis *= 1 - Math.min(0.85, occ * strength);
    }
    return vis;
  },

  /** A linear grey map covering the floor rectangle (row 0 = near), darkened around every
   *  occluder's footprint. */
  floorMap(minX, maxX, nearZ, farZ, width, floor, occluders) {
    const height = Math.max(1, Math.floor(width * Math.abs(farZ - nearZ) / (maxX - minX)));
    const vis = new Float32Array(width * height).fill(1);
    const du = (maxX - minX) / width, dv = (farZ - nearZ) / height;
    for (const o of occluders) {
      const reach = o.radius * 4;
      const i0 = Math.max(0, Math.floor((o.cx - reach - minX) / du)), i1 = Math.min(width - 1, Math.floor((o.cx + reach - minX) / du));
      const jA = Math.trunc((o.cz - reach - nearZ) / dv), jB = Math.trunc((o.cz + reach - nearZ) / dv);
      const j0 = Math.max(0, Math.min(jA, jB)), j1 = Math.min(height - 1, Math.max(jA, jB));
      if (i0 > i1 || j0 > j1) continue;
      const single = [o];
      for (let j = j0; j <= j1; j++) {
        const z = nearZ + (j + 0.5) * dv;
        for (let i = i0; i <= i1; i++) {
          const x = minX + (i + 0.5) * du;
          vis[j * width + i] *= Occlusion.visibility(x, floor(x, z), z, 0, 1, 0, single, -99, 1.3);
        }
      }
    }
    const bytes = new Uint8Array(width * height);
    for (let i = 0; i < bytes.length; i++) bytes[i] = clamp(vis[i], 0, 1) * 255;
    const t = new THREE.DataTexture(bytes, width, height, THREE.RedFormat, THREE.UnsignedByteType);
    t.unpackAlignment = 1;
    t.minFilter = THREE.LinearFilter;
    t.magFilter = THREE.LinearFilter;
    t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping;
    t.colorSpace = THREE.NoColorSpace;
    t.needsUpdate = true;
    return t;
  },
};

const occluder = (center, radius, piece) => ({ cx: center.x, cy: center.y, cz: center.z, radius, piece });
// ---------------------------------------------------------------------------------------------
// Shaders (Shaders.swift, FishShaders.swift, FishMaterials.swift skin). SceneKit shader modifiers
// become `onBeforeCompile` patches of MeshStandardMaterial.
// ---------------------------------------------------------------------------------------------

/** Shader time wraps every `TIME_WRAP` seconds, keeping float precision however long the page
 *  runs. Every animation frequency is quantised to a whole number of cycles per wrap. */
const TIME_WRAP = 3600;
const QK = TIME_WRAP / TAU;
/** Quantise an angular frequency on the CPU, matching the shaders' quantisers. */
const quantize = (w) => Math.round(w * QK) / QK;
const glslFloat = (x) => (Number.isInteger(x) ? x.toFixed(1) : String(x));
const quantizer = (name) => `float ${name}(float w) { return floor(w * ${glslFloat(QK)} + 0.5) / ${glslFloat(QK)}; }\n`;

/** Uniforms shared by every material in the tank (time, the night lamp, the cursor). */
const G = {
  uTime: { value: 0 },
  // Caustics and the night spotlight (driven by `Lighting`).
  causticNight: { value: 0 },
  spotPos: { value: v3() },
  spotT: { value: new THREE.Vector2() },
  spotCos: { value: 1 },
  fishCaustic: { value: 0.35 },
  // The cursor, for plants (driven by `PlantBed`).
  curX: { value: 0 },
  curY: { value: 0 },
  curVX: { value: 0 },
  eyeDist: { value: 1 },
};

// Make three.js fog behave like SceneKit's: distance from the camera, density exponent 1.3.
THREE.ShaderChunk.fog_vertex = `#ifdef USE_FOG
  vFogDepth = length( mvPosition.xyz );
#endif`;
THREE.ShaderChunk.fog_fragment = `#ifdef USE_FOG
  float fogFactor = pow( clamp( ( vFogDepth - fogNear ) / ( fogFar - fogNear ), 0.0, 1.0 ), 1.3 );
  gl_FragColor.rgb = mix( gl_FragColor.rgb, fogColor, fogFactor );
#endif`;

/**
 * Patch a MeshStandardMaterial (and optionally a matching shadow depth material).
 *  - vHead: declarations for the vertex shader; vMain: code at the top of main() that edits
 *    `gPos` / `gNrm` (object-space position and normal) before three.js uses them.
 *  - fHead: fragment declarations; fMap: replaces the map sample; fAfterNormal / fAfterEmissive /
 *    fBeforeOpaque: code inserted at those stages. `vCauWP` (world position) is always available.
 */
function patchMaterial(mat, cfg) {
  const key = cfg.key;
  mat.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, cfg.uniforms || {});
    let vs = sh.vertexShader, fs = sh.fragmentShader;
    vs = vs.replace('#include <common>', '#include <common>\nvarying vec3 vCauWP;\n' + (cfg.vHead || ''));
    vs = vs.replace('void main() {', 'void main() {\n  vec3 gPos = vec3(position);\n  vec3 gNrm = vec3(normal);\n' + (cfg.vMain || ''));
    vs = vs.replace('#include <beginnormal_vertex>', 'vec3 objectNormal = gNrm;\n#ifdef USE_TANGENT\nvec3 objectTangent = vec3(tangent.xyz);\n#endif');
    vs = vs.replace('#include <begin_vertex>', 'vec3 transformed = gPos;');
    vs = vs.replace('#include <project_vertex>', '#include <project_vertex>\n  vCauWP = (modelMatrix * vec4(transformed, 1.0)).xyz;');
    fs = fs.replace('#include <common>', '#include <common>\nvarying vec3 vCauWP;\n' + (cfg.fHead || ''));
    if (cfg.fMap) fs = fs.replace('#include <map_fragment>', cfg.fMap);
    if (cfg.fAfterNormal) fs = fs.replace('#include <normal_fragment_maps>', '#include <normal_fragment_maps>\n' + cfg.fAfterNormal);
    if (cfg.fAfterEmissive) fs = fs.replace('#include <emissivemap_fragment>', '#include <emissivemap_fragment>\n' + cfg.fAfterEmissive);
    if (cfg.fBeforeOpaque) fs = fs.replace('#include <opaque_fragment>', cfg.fBeforeOpaque + '\n#include <opaque_fragment>');
    sh.vertexShader = vs;
    sh.fragmentShader = fs;
  };
  mat.customProgramCacheKey = () => key;
  return mat;
}

/** A shadow-casting depth material that applies the same vertex deformation. */
function patchedDepthMaterial(cfg) {
  const mat = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking });
  mat.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, cfg.uniforms || {});
    let vs = sh.vertexShader;
    vs = vs.replace('#include <common>', '#include <common>\n' + (cfg.vHead || ''));
    vs = vs.replace('void main() {', 'void main() {\n  vec3 gPos = vec3(position);\n  vec3 gNrm = vec3(normal);\n' + (cfg.vMain || ''));
    vs = vs.replace('#include <begin_vertex>', 'vec3 transformed = gPos;');
    sh.vertexShader = vs;
  };
  mat.customProgramCacheKey = () => cfg.key + '-depth';
  return mat;
}

/** Texture sampled as premultiplied alpha, un-premultiplied (no dark fringes on cut-outs). */
const MAP_UNPREMULTIPLY = `
#ifdef USE_MAP
  vec4 sampledDiffuseColor = texture2D( map, vMapUv );
  sampledDiffuseColor.rgb /= max( sampledDiffuseColor.a, 0.0001 );
  diffuseColor *= sampledDiffuseColor;
#endif`;

// ---- Caustics: moving light on upward-facing surfaces (sand, rocks, plants, fish backs) ----

const CAUSTICS_HEAD = quantizer('cauQ') + `
uniform float uTime;
uniform float causticNight;
uniform vec3 spotPos;
uniform vec2 spotT;
uniform float spotCos;
float cauHash(vec2 p) {
  p = fract(p * vec2(234.34, 435.345));
  p += dot(p, p + 34.23);
  return fract(p.x * p.y);
}
float cauCells(vec2 p, float t, float speed) {
  vec2 ip = floor(p);
  vec2 fp = fract(p);
  float d1 = 8.0;
  float d2 = 8.0;
  for (int j = -1; j <= 1; j++) {
    for (int i = -1; i <= 1; i++) {
      vec2 g = vec2(float(i), float(j));
      float h1 = cauHash(ip + g);
      float h2 = cauHash(ip + g + 17.17);
      vec2 o = 0.5 + 0.42 * sin(t * cauQ(speed * (0.5 + 0.4 * h2)) + 6.2831 * vec2(h1, h2));
      float d = length(g + o - fp);
      if (d < d1) { d2 = d1; d1 = d; } else if (d < d2) { d2 = d; }
    }
  }
  return pow(clamp(1.0 - (d2 - d1) * 1.7, 0.0, 1.0), 5.0);
}
// At night, caustics only appear inside the spotlight's cone. The lamp hangs at spotPos and
// aims at (spotT, spotPos.z).
vec3 causticLight(vec3 wp, vec3 wn, vec3 diffuse, float strength) {
  float t = uTime;
  vec2 cp = wp.xz * 1.3 + vec2(wp.y * 0.3, 0.0);
  cp += 0.3 * vec2(sin(cp.y * 1.3 + t * cauQ(0.35)), cos(cp.x * 1.1 - t * cauQ(0.3)));
  float c = cauCells(cp, t, 0.9);
  float up = clamp(wn.y * 0.8 + 0.2, 0.0, 1.0);
  vec3 aim = normalize(vec3(spotT, spotPos.z) - spotPos);
  float cosA = dot(normalize(wp - spotPos), aim);
  float inSpot = smoothstep(spotCos, cos(acos(spotCos) * 0.4), cosA);
  float gain = mix(1.0, inSpot * 1.6, causticNight);
  vec3 tint = mix(vec3(0.55, 0.85, 0.9), vec3(1.0, 0.92, 0.75), causticNight);
  return tint * c * up * strength * gain * (0.2 + diffuse);
}
`;
const CAUSTICS_APPLY = (strength) =>
  `totalEmissiveRadiance += causticLight(vCauWP, inverseTransformDirection(normal, viewMatrix), diffuseColor.rgb, ${strength});`;

const causticUniforms = () => ({
  uTime: G.uTime, causticNight: G.causticNight, spotPos: G.spotPos, spotT: G.spotT, spotCos: G.spotCos,
});

// ---- Reef: caustics plus triplanar surface detail (its UVs only index a colour palette) ----

const REEF_HEAD = CAUSTICS_HEAD + `
uniform sampler2D detailNormal;
uniform float detailScale;
uniform float detailStrength;
uniform float causticStrength;
`;
const REEF_DETAIL = `{
  vec3 dwp = vCauWP;
  vec3 dwn = inverseTransformDirection(normal, viewMatrix);
  vec3 bw = pow(abs(dwn), vec3(4.0));
  bw /= (bw.x + bw.y + bw.z);
  vec2 tx = texture2D(detailNormal, dwp.zy * detailScale).xy * 2.0 - 1.0;
  vec2 ty = texture2D(detailNormal, dwp.xz * detailScale).xy * 2.0 - 1.0;
  vec2 tz = texture2D(detailNormal, dwp.xy * detailScale).xy * 2.0 - 1.0;
  vec3 bump = vec3(0.0, tx.y, tx.x) * bw.x + vec3(ty.x, 0.0, ty.y) * bw.y + vec3(tz.x, tz.y, 0.0) * bw.z;
  dwn = normalize(dwn + bump * detailStrength);
  normal = normalize((viewMatrix * vec4(dwn, 0.0)).xyz);
}`;

// ---- Plant sway: per-vertex (height fraction, plant height, phase, amplitude) in aSway ----

const SWAY_HEAD = quantizer('swayQ') + `
attribute vec4 aSway;
uniform float uTime;
uniform float curX;
uniform float curY;
uniform float curVX;
uniform float eyeDist;
void plantSway(inout vec3 p) {
  float v = aSway.x;
  float h = aSway.y;
  float ph = aSway.z;
  float amp = aSway.w;
  float t = uTime;
  float spd = 0.6 + 0.5 * fract(ph * 7.13);
  float sway = amp * (sin(t * swayQ(spd) + v * 2.2 + ph) + 0.4 * sin(t * swayQ(spd * 1.7) + v * 4.0 + ph * 2.0));
  float w = pow(max(v, 0.0), 1.6);
  // Water pushed by the cursor bends plants that appear near it on screen.
  float f = eyeDist / (eyeDist - p.z);
  float baseY = (p.y - v * h) * f;
  float inRange = step(baseY - 0.2, curY) * step(curY, baseY + h * f + 0.6);
  float prox = clamp(1.0 - abs(p.x * f - curX) / 1.5, 0.0, 1.0) * inRange;
  float bend = clamp(curVX * 0.07, -0.8, 0.8) * prox;
  p.x += (sway + bend) * w;
  p.z += (0.5 * sway * cos(ph) - abs(bend) * 0.3) * w;
}
`;
const swayUniforms = () => ({ uTime: G.uTime, curX: G.curX, curY: G.curY, curVX: G.curVX, eyeDist: G.eyeDist });

// ---- Fish: the swim wave, shared by body and fins ----

const SWIM_HEAD = `
uniform float uTime;
uniform float swimFreq;
uniform float swimOffset;
uniform float swimAmp;
uniform float swimBend;
uniform float noseX;
uniform float bodyLen;
// Bends the vertex sideways in a travelling wave that grows toward the tail, and curves the whole
// body into an arc while turning. Must stay in sync with FishRig.lateralOffset.
void swimBody(inout vec3 p, inout vec3 n, float s, float env, float wave) {
  float k = 3.2;
  float off = env * sin(wave) + swimBend * s * s;
  float dOffDs = swimAmp * 2.0 * s * sin(wave) - env * k * cos(wave) + swimBend * 2.0 * s;
  float slope = -dOffDs / bodyLen;
  p.z += off;
  n = normalize(vec3(n.x - slope * n.z, n.y, n.z));
}
`;

/** The body: the swim wave, plus breathing near the head (mouth and gill covers). */
const FISH_BODY_HEAD = SWIM_HEAD + `
uniform float breathFreq;
uniform float breathPhase;
uniform float mouthAmp;
uniform float gillAmp;
uniform float gillX;
uniform float gulpTime;
void fishBody(inout vec3 p, inout vec3 bn) {
  float t = uTime;
  float swimPhase = t * swimFreq + swimOffset;
  float s = max(0.0, (noseX - p.x) / bodyLen);
  float env = swimAmp * (0.08 + s * s);
  float wave = swimPhase - s * 3.2;
  if (s < gillX + 0.03) {
    float breath = sin(t * breathFreq + breathPhase);
    float sinceGulp = t - gulpTime;
    float gulp = sinceGulp < 0.0 ? 0.0 : smoothstep(0.0, 0.08, sinceGulp) * (1.0 - smoothstep(0.2, 0.65, sinceGulp));
    // Which way round the body the vertex faces: x = up/down, y = sideways.
    vec2 around = normalize(bn.yz + vec2(1e-5, 0.0));
    // Mouth: the lips part at the tip of the snout, the lower jaw dropping further.
    float gape = mouthAmp * bodyLen * (0.25 * max(0.0, breath) + 1.6 * gulp);
    float lip = 1.0 - smoothstep(0.0, 0.08, s);
    p.y += gape * lip * (around.x < 0.0 ? 1.3 * around.x : 0.6 * around.x);
    p.x -= gape * 1.6 * lip * lip * (1.0 - abs(around.x));
    // Gill covers: the rear edge lifts off the flank, lit and shaded as it tilts.
    float flare = gillAmp * bodyLen * (max(0.0, -breath) + gulp * 0.6) * abs(around.y);
    float edge = gillX - 0.045 * around.y * around.y;
    float rise = smoothstep(edge - 0.12, edge - 0.005, s);
    float drop = 1.0 - smoothstep(edge - 0.005, edge + 0.03, s);
    float dRise = (s > edge - 0.12 && s < edge - 0.005) ? 1.0 / 0.115 : 0.0;
    float dDrop = (s > edge - 0.005 && s < edge + 0.03) ? -1.0 / 0.035 : 0.0;
    float side = sign(p.z);
    p.z += side * flare * rise * drop;
    float gSlope = -side * flare * (dRise * drop + rise * dDrop) / bodyLen;
    bn = normalize(vec3(bn.x - gSlope * bn.z, bn.y, bn.z));
  }
  swimBody(p, bn, s, env, wave);
}
`;

/** Fins: each moves on its own before following the body's swim wave. Per-vertex data in aFin
 *  (see FishFins.data) says which fin a vertex belongs to and where on it. */
const FISH_FINS_HEAD = SWIM_HEAD + quantizer('finQ') + `
attribute vec4 aFin;
uniform float finFreq;
uniform float finSeed;
uniform vec4 finFrom;
uniform vec4 finTo;
uniform float finTime;
void fishFins(inout vec3 fp, inout vec3 fn) {
  vec4 fd = aFin;
  float t = uTime;
  float swimPhase = t * swimFreq + swimOffset;
  float s = max(0.0, (noseX - fp.x) / bodyLen);
  float env = swimAmp * (0.08 + s * s);
  float wave = swimPhase - s * 3.2;
  float sinceFin = t - finTime;
  vec4 fs = mix(finFrom, finTo, sinceFin < 0.0 ? 1.0 : clamp(sinceFin / 0.4, 0.0, 1.0));
  float hover = fs.x;
  float brake = fs.y;
  float kind = floor(fd.x + 0.001);
  float flow = (fd.x - kind) * 2.0;
  float finPh = t * finFreq + finSeed;
  if (kind > 2.5) {
    // Paired fins turn about their root edge: the tip swings between the root-to-tip direction d
    // and the outward face normal.
    float side = sign(fd.y);
    float dist = abs(fd.y);
    vec3 d = vec3(fd.z, fd.w, side * sqrt(max(0.0, 1.0 - fd.z * fd.z - fd.w * fd.w)));
    vec3 outward = side * fn;
    float pelvic = step(3.5, kind);
    float ph = finPh + side * 0.7 + pelvic * 2.1;
    float amp = mix(mix(0.1, 0.45, hover), mix(0.05, 0.2, hover), pelvic);
    // Tucked in at speed, held out when hovering, flared wide when braking.
    float rest = mix(-0.3 * (1.0 - hover) + 0.1 + 0.9 * brake, 0.45 * brake, pelvic);
    float along = dist / bodyLen;
    float theta = rest + amp * sin(ph) + flow * along * 0.4 * sin(t * finQ(finFreq * 0.5) + finSeed - along * 3.5);
    float c = cos(theta) - 1.0;
    float sn = sin(theta);
    fp += dist * (c * d + sn * outward);
    // Rowing: the tip also sweeps forward and back, a quarter beat out of step.
    fp.x += dist * amp * 0.35 * (1.0 - pelvic) * cos(ph);
    fn = fn * cos(theta) - side * d * sn;
  } else if (kind > 1.5) {
    // Tail: long tails trail behind the beat and billow on their own.
    float sp = fd.y;
    float yN = fd.z;
    float len = fd.w;
    float bph = t * finQ(finFreq * 0.55) + finSeed - 3.5 * sp + 1.8 * yN;
    float trail = env * 1.2 * (sin(wave - 1.3 * sp) - sin(wave));
    float billow = bodyLen * (0.005 + 0.05 * flow) * sin(bph);
    float lag = 0.15 + 0.6 * flow;
    float dz = sp * sp * (lag * trail + billow);
    float dzds = 2.0 * sp * (lag * trail + billow) - sp * sp * bodyLen * (0.005 + 0.05 * flow) * 3.5 * cos(bph);
    float dzdy = sp * sp * bodyLen * (0.005 + 0.05 * flow) * 1.8 * cos(bph) / max(len * 0.7, 1e-4);
    fp.z += dz;

uniform vec4 fishPale;

  const vec3 k = vec3(0.57735);
  float ca = cos(a);
  return c * ca + cross(k, c) * sin(a) + k * dot(k, c) * (1.0 - ca);
}
float fmHash(vec2 p) {
  p = fract(p * vec2(127.1, 311.7));
  p += dot(p, p + 19.19);
  return fract(p.x * p.y);

float fmNoise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(fmHash(i), fmHash(i + vec2(1.0, 0.0)), f.x), mix(fmHash(i + vec2(0.0, 1.0)), fmHash(i + vec2(1.0, 1.0)), f.x), f.y);

function beamMaterial() {
  return new THREE.ShaderMaterial({
    uniforms: { beamStrength: { value: 0 }, beamTop: { value: 0 }, beamBottom: { value: 0 } },
    vertexShader: `
      varying vec3 vN;
      varying vec3 vV;
      varying vec3 vW;
      void main() {
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        vN = normalize(normalMatrix * normal);
        vV = -mv.xyz;
        vW = (modelMatrix * vec4(position, 1.0)).xyz;
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      uniform float beamStrength;
      uniform float beamTop;
      uniform float beamBottom;
      varying vec3 vN;
      varying vec3 vV;
      varying vec3 vW;
      void main() {
        float facing = abs(dot(normalize(vN), normalize(vV)));
        float h = clamp((vW.y - beamBottom) / (beamTop - beamBottom), 0.0, 1.0);
        float a = pow(facing, 3.0) * mix(0.3, 1.0, h) * beamStrength * smoothstep(beamTop + 0.5, beamTop - 1.5, vW.y);
        gl_FragColor = vec4(vec3(1.0, 0.93, 0.78) * a, 1.0);
      }`,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  });
}

// ---- Drifting specks ("marine snow"), lit: they glint in the night lamp and fade in the dark ----

function snowMaterial() {
  return new THREE.ShaderMaterial({
    uniforms: {
      uTime: G.uTime, spotPos: G.spotPos, spotT: G.spotT, spotCos: G.spotCos, causticNight: G.causticNight,
      pxScale: { value: 1 }, fogNear: { value: 1 }, fogFar: { value: 2 }, dayLight: { value: 1 },
    },
    vertexShader: `
      attribute vec4 aSeed;   // start offset in the box (xyz), size
      attribute vec4 aMotion; // velocity (xyz), lifespan
      attribute float aBirth;
      uniform float uTime;
      uniform float pxScale;
      uniform vec3 spotPos;
      uniform vec2 spotT;
      uniform float spotCos;
      uniform float causticNight;
      uniform float fogNear;
      uniform float fogFar;
      uniform float dayLight;
      varying float vA;
      void main() {
        float life = aMotion.w;
        float age = mod(uTime + aBirth, life);
        vec3 p = position + aMotion.xyz * age + vec3(0.0, -0.002, 0.0) * age * age;
        vec4 wp = modelMatrix * vec4(p, 1.0);
        vec4 mv = viewMatrix * wp;
        gl_Position = projectionMatrix * mv;
        gl_PointSize = max(1.0, aSeed.w * pxScale / -mv.z);
        vec3 aim = normalize(vec3(spotT, spotPos.z) - spotPos);
        float inSpot = smoothstep(spotCos, cos(acos(spotCos) * 0.5), dot(normalize(wp.xyz - spotPos), aim));
        float lit = mix(dayLight, inSpot * 1.6 + 0.05, causticNight);
        float fade = smoothstep(0.0, 2.0, age) * (1.0 - smoothstep(life - 2.0, life, age));
        float fog = pow(clamp((length(mv.xyz) - fogNear) / (fogFar - fogNear), 0.0, 1.0), 1.3);
        vA = 0.35 * lit * fade * (1.0 - fog);

    fragmentShader: `

      void main() {

        gl_FragColor = vec4(vec3(0.8, 0.95, 1.0) * r * vA, 1.0);
      }`,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  });
}

/** One half of the body's side-view outline (the back or the belly) and the shape of that half of
 *  every cross-section. Heights are fractions of half the species' height; positions are fractions
 *  of body length from the tail joint (0) to the nose (1). */
const BodyProfile = (o) => Object.assign({ depth: 1, peak: 0.5, peduncle: 0.36, head: 2, snout: 0.6, rear: 2, pinch: 0.4, roundness: 2 }, o);
BodyProfile.back = BodyProfile({ depth: 1, peak: 0.5, peduncle: 0.36, roundness: 1.7 });

/** Height of this half of the outline at t along the body (0 = tail joint, 1 = nose). */
function profileHeight(p, t) {
  t = clamp(t, 0, 1);
  if (t < p.peak) {
    // Rising from the peduncle: a smooth swell, or pinched flat just ahead of the tail.
    const u = t / p.peak;
    const swell = 1 - Math.pow(1 - u, p.rear), pinched = u * u * (3 - 2 * u);
    return p.peduncle + (p.depth - p.peduncle) * lerp(swell, pinched, p.pinch);
  }
  const v = (t - p.peak) / (1 - p.peak);
  return p.depth * Math.pow(Math.max(0, 1 - Math.pow(v, p.head)), p.snout);
}

// ---------------------------------------------------------------------------------------------
// The 3D body (FishBody.swift): a loft of cross-sections along the side-view outline, with the
// painted skin wrapped round it
// ---------------------------------------------------------------------------------------------

const FishBody = {
  /** Vertices round each cross-section (a multiple of 4). */
  ring: 28,
  arcSteps: 4,

  /** Cross-section at x (species points): back height, belly depth and half-width. */
  section(s, x) {
    const t = clamp((x + s.length / 2) / s.length, 0, 1);
    const b = s.height / 2;
    const top = profileHeight(s.backProfile, t) * b, bottom = profileHeight(s.bellyProfile, t) * b;
    // Thin toward the tail (the peduncle is flattened side to side), rounder through the head.
    const taper = 0.45 + 0.55 * Math.min(1, t / 0.4);
    return { top, bottom, halfWidth: (top + bottom) / 2 * s.thickness * taper };
  },

  /** The point (y, z) on a cross-section at `angle` round it: 0 is the dorsal midline, π/2 the
   *  middle of the +z flank, π the ventral midline. Each half is a superellipse. */
  ringPoint(c, s, th) {
    const up = Math.cos(th), side = Math.sin(th);
    const e = 2 / (up >= 0 ? s.backProfile.roundness : s.bellyProfile.roundness);
    const y = Math.pow(Math.abs(up), e) * (up >= 0 ? c.top : -c.bottom);
    const z = Math.pow(Math.abs(side), e) * c.halfWidth * (side >= 0 ? 1 : -1);
    return [y, z];
  },

  /** Distance over the skin from the dorsal midline to evenly spaced angles down one flank. */
  arcs(c, s) {
    const n = FishBody.ring / 2 * FishBody.arcSteps;
    const out = [0];
    let prev = FishBody.ringPoint(c, s, 0);
    for (let k = 1; k <= n; k++) {
      const p = FishBody.ringPoint(c, s, k / n * Math.PI);
      out.push(out[k - 1] + Math.hypot(p[0] - prev[0], p[1] - prev[1]));
      prev = p;
    }
    return out;
  },

  /** How much of the skin image the body wraps at x: up to the back, down to the belly. */
  girth(s, x) {
    const arcs = FishBody.arcs(FishBody.section(s, x), s);
    const equator = arcs[arcs.length >> 1];
    return { up: equator, down: arcs[arcs.length - 1] - equator };
  },

  /** The body mesh in species points, UV-mapped to the skin image. */
  mesh(s, art) {
    const count = 36, ring = FishBody.ring;
    const a = s.length / 2;
    const rect = art.skinRect;
    const uv = (x, arc) => [(x - rect.x) / rect.w, 1 - (arc - rect.y) / rect.h];
    const m = new Mesh();
    for (let i = 0; i <= count; i++) {
      // Denser toward both ends, where the outline curves fastest.
      const t = i / count;
      const f = 0.5 * t + 0.25 * (1 - Math.cos(Math.PI * t));
      const x = -a + 2 * a * f;
      const section = FishBody.section(s, x);
      const arcs = FishBody.arcs(section, s);
      const equator = arcs[arcs.length >> 1];
      for (let j = 0; j < ring; j++) {
        const th = j / ring * TAU;
        const p = FishBody.ringPoint(section, s, th);
        m.p.push(x, p[0], p[1]);
        // Both flanks share the image, mirrored, so it meets itself along the midlines.
        const k = (j <= ring / 2 ? j : ring - j) * FishBody.arcSteps;
        m.addUV(uv(x, equator - arcs[k]));
      }
    }
    for (let i = 0; i < count; i++) {
      for (let j = 0; j < ring; j++) {
        const q = i * ring + j, b = i * ring + (j + 1) % ring;
        m.quad(q, b, q + ring, b + ring);
      }
    }
    // Round off the tail end with a short cone, tucked into the root of the tail fin.
    const end = FishBody.section(s, -a);
    const tip = v3(-a - (end.top + end.bottom) * 0.25, (end.top - end.bottom) / 2, 0);
    const center = m.count;
    m.addPos(tip);
    m.addUV(uv(tip.x, tip.y));
    for (let j = 0; j < ring; j++) m.triangle(center, (j + 1) % ring, j);
    return m;
  },
};

// ---------------------------------------------------------------------------------------------
// Painted fish images (FishArt.swift), in "fish space": points, body centred on the origin,
// nose toward +x
// ---------------------------------------------------------------------------------------------

const FishArt = {
  cache: {},
  forSpecies(s) {
    return FishArt.cache[s.id] ??= FishArt.make(s);
  },

  make(s) {
    const [skin, skinRect] = FishArt.makeSkin(s);
    const [fins, finsRect] = FishArt.makeFins(s);
    const [tail, tailRect] = FishArt.makeTail(s);
    const [pectoral, pectoralSize] = FishArt.makePectoral(s);
    return { skin, skinRect, fins, finsRect, tail, tailRect, pectoral, pectoralSize };
  },

  outline(s, x) {
    const c = FishBody.section(s, x);
    return { top: c.top, bottom: c.bottom };
  },

  extent(s) {
    let top = 0, bottom = 0;
    for (let i = 0; i <= 64; i++) {
      const o = FishArt.outline(s, s.length * (i / 64 - 0.5));
      top = Math.max(top, o.top);
      bottom = Math.max(bottom, o.bottom);
    }
    return { top, bottom };
  },

  /** A dorsal (`top`) or anal fin. Its base runs inside the body along the back or belly line. */
  finPath(f, s, top) {
    const a = s.length / 2, L = s.length;
    const sign = top ? 1 : -1;
    const edge = (x) => { const o = FishArt.outline(s, x); return top ? o.top : o.bottom; };
    const back = -a + f.start * L, front = -a + f.end * L;
    const tip = [back + (front - back) * 0.15 - f.sweep * L, edge(back + (front - back) * 0.4) + f.height];
    const rear = edge(back);
    const path = new Path2D();
    path.moveTo(front, edge(front) * 0.5 * sign);
    path.quadraticCurveTo(front - 0.15 * (front - back), tip[1] * sign, tip[0], tip[1] * sign);
    path.quadraticCurveTo(tip[0] + (back - tip[0]) * 0.7, (rear + (tip[1] - rear) * 0.35) * sign, back, rear * 0.5 * sign);
    for (let i = 1; i <= 8; i++) {
      const x = back + (front - back) * i / 8;
      path.lineTo(x, edge(x) * 0.5 * sign);
    }
    path.closePath();
    return path;
  },

  paintFin(ctx, path, s, from, to) {
    if (s.shape === 'shark') {
      // Solid, like the body, painted a little lighter than the back to read as the same slate grey.
      ctx.save();
      ctx.clip(path);
      Art.linear(ctx, [s.top.mix(s.mid, 0.45), s.top.mix(s.mid, 0.6)], null, from, to);
      ctx.restore();
      return;
    }
    ctx.save();
    ctx.clip(path);
    Art.linear(ctx, [s.fin, s.fin.lighter(0.25).alpha(s.fin.a * 0.55)], null, from, to);
    // Fin rays.
    ctx.strokeStyle = s.fin.darker(0.35).alpha(0.3).css;
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    for (let i = 0; i <= 12; i++) {
      const t = i / 12;
      ctx.moveTo(lerp(from[0] - s.length * 0.4, from[0] + s.length * 0.4, t), from[1]);
      ctx.lineTo(lerp(to[0] - s.length * 0.6, to[0] + s.length * 0.2, t), to[1]);
    }
    ctx.stroke();
    ctx.restore();
    if (s.finEdge) {
      ctx.strokeStyle = s.finEdge.css;
      ctx.lineWidth = 1.4;
      ctx.stroke(path);
    }
  },

  /** The skin, unwrapped: x runs along the body as in the side view, y is the distance over the
   *  skin from the flank's centre line. */
  makeSkin(s) {
    const a = s.length / 2, L = s.length;
    const columns = Math.ceil((L + 4) * Art.scale);
    const girths = [];
    for (let i = 0; i < columns; i++) girths.push(FishBody.girth(s, -a - 2 + (i + 0.5) / Art.scale));
    const up = Math.max(...girths.map((g) => g.up)), down = Math.max(...girths.map((g) => g.down));
    const rect = { x: -a - 2, y: -down - 2, w: L + 4, h: up + down + 4 };
    const maxY = rect.y + rect.h;
    const img = Art.image(rect.w, rect.h, Art.scale, (ctx) => {
      ctx.translate(-rect.x, -rect.y);
      // Countershading, a pixel column at a time so it follows the body: darkest along the back,
      // palest along the belly. Real lighting adds the shape on top.
      const dorsal = s.top.darker(0.3), ventral = s.belly.lighter(0.2);
      girths.forEach((g, i) => {
        const x = rect.x + i / Art.scale, w = 1 / Art.scale;
        ctx.save();
        ctx.beginPath(); ctx.rect(x, 0, w, maxY); ctx.clip();
        Art.linear(ctx, [dorsal, s.top, s.mid], [0, 0.25, 1], [x, g.up], [x, 0]);
        ctx.restore();
        ctx.save();
        ctx.beginPath(); ctx.rect(x, rect.y, w, -rect.y); ctx.clip();
        Art.linear(ctx, [s.mid, s.belly, ventral], [0, 0.8, 1], [x, 0], [x, -g.down]);
        ctx.restore();
      });
      FishArt.paintPattern(ctx, s, rect);
      // Gill cover (sharks have gill slits instead, drawn with their pattern).
      if (s.shape !== 'shark') {
        const gx = a - 0.3 * L, o = FishArt.outline(s, gx);
        ctx.strokeStyle = s.top.darker(0.4).alpha(0.35).css;
        ctx.lineWidth = Math.max(0.6, L * 0.015);
        ctx.beginPath();
        ctx.moveTo(gx, o.top * 0.7);
        ctx.quadraticCurveTo(gx + L * 0.09, 0, gx, -o.bottom * 0.65);
        ctx.stroke();
      }
      // Mouth.
      const b = s.height / 2;
      ctx.strokeStyle = new RGBA(0, 0, 0, 0.4).css;
      ctx.lineWidth = 0.7;
      ctx.beginPath();
      ctx.moveTo(a, -b * 0.08);
      ctx.lineTo(a - L * 0.07, -b * 0.16);
      ctx.stroke();
    });
    return [img, rect];
  },

  makeFins(s) {
    const L = s.length, a = L / 2;
    const { top: up, bottom: down } = FishArt.extent(s);
    const sweep = Math.max(s.dorsal.sweep, s.anal.sweep);
    const finH = Math.max(s.dorsal.height, s.anal.height);
    const rect = { x: -a - L * sweep - 4, y: -(down + finH + 4), w: L * (1 + sweep) + 8, h: up + down + 2 * (finH + 4) };
    const img = Art.image(rect.w, rect.h, Art.scale, (ctx) => {
      ctx.translate(-rect.x, -rect.y);
      FishArt.paintFin(ctx, FishArt.finPath(s.dorsal, s, true), s, [0, up * 0.5], [0, up + s.dorsal.height]);
      FishArt.paintFin(ctx, FishArt.finPath(s.anal, s, false), s, [0, -down * 0.5], [0, -down - s.anal.height]);
      if (s.shape === 'shark') {
        // The small second dorsal fin, just ahead of the tail.
        const second = Fin(0.07, 0.12, 16, 0.03);
        FishArt.paintFin(ctx, FishArt.finPath(second, s, true), s, [0, up * 0.2], [0, up * 0.2 + second.height]);
      }
    });
    return [img, rect];
  },

  /** `rect` is the whole skin image; patterns that wrap round the body span all of it. */
  paintPattern(ctx, s, rect) {
    const L = s.length, a = L / 2, b = s.height / 2;
    const maxY = rect.y + rect.h;
    switch (s.pattern) {
      case 'neon': {
        // Red lower rear half.
        ctx.save();
        ctx.beginPath(); ctx.rect(-a, rect.y, 0.62 * L, -rect.y - b * 0.05); ctx.clip();
        const red = new RGBA(0.95, 0.08, 0.14, 0.95);
        Art.linear(ctx, [red, red, red.alpha(0)], [0, 0.7, 1], [-a, 0], [-a + 0.62 * L, 0]);
        ctx.restore();
        // Glowing blue stripe.
        const st = { x: -a + 0.1 * L, y: b * 0.02, w: 0.76 * L, h: b * 0.36 };
        const r = st.h / 2;
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(st.x + r, st.y);
        ctx.lineTo(st.x + st.w - r, st.y);
        ctx.arc(st.x + st.w - r, st.y + r, r, -Math.PI / 2, Math.PI / 2);
        ctx.lineTo(st.x + r, st.y + st.h);
        ctx.arc(st.x + r, st.y + r, r, Math.PI / 2, Math.PI * 1.5);
        ctx.closePath();
        ctx.clip();
        Art.linear(ctx, [new RGBA(0.1, 0.5, 1.0), new RGBA(0.35, 0.98, 1.0), new RGBA(0.15, 0.65, 1.0)], null, [st.x, 0], [st.x + st.w, 0]);
        ctx.restore();
        break;
      }
      case 'metallic':
        // Scales come from the body's normal map (see `Detail.scales`).
        break;
      case 'shark': {
        // Crisp white underside along the lower flank, with a softly feathered, slightly wavy edge.
        const belly = new Path2D();
        belly.moveTo(-a - 4, rect.y - 1);
        for (let i = 0; i <= 24; i++) {
          const t = i / 24;
          const x = -a - 4 + (L + 8) * t;
          // The line rises toward the head, like a real shark's countershading.
          belly.lineTo(x, -b * 0.22 + b * 0.2 * t + b * 0.05 * Math.sin(t * 19));
        }
        belly.lineTo(a + 4, rect.y - 1);
        belly.closePath();
        ctx.save();
        const white = new RGBA(0.95, 0.95, 0.93).css;
        ctx.shadowBlur = b * 0.12;
        ctx.shadowColor = white;
        ctx.fillStyle = white;
        ctx.fill(belly);
        ctx.restore();
        // Five long gill slits ahead of the pectoral fins, curving back at the bottom.
        ctx.strokeStyle = s.top.darker(0.55).alpha(0.6).css;
        ctx.lineWidth = 1.6;
        ctx.lineCap = 'round';
        ctx.beginPath();
        for (let k = 0; k < 5; k++) {
          const x = a - 0.2 * L - k * 0.024 * L;
          const reach = 1 + k * 0.05;
          ctx.moveTo(x + 0.004 * L, b * 0.42 * reach);
          ctx.quadraticCurveTo(x + 0.016 * L, 0, x - 0.016 * L, -b * 0.38 * reach);
        }
        ctx.stroke();
        break;
      }
      case 'angel':
        for (const [c, w] of [[0.84, 0.05], [0.58, 0.07], [0.30, 0.06]]) {
          const x = -a + c * L;
          ctx.fillStyle = new RGBA(0.08, 0.08, 0.08, 0.72).css;
          ctx.fillRect(x - w * L / 2, rect.y, w * L, rect.h);
        }
        break;
      case 'clown': {
        // The bands wrap right over the back and under the belly.
        const reach = Math.max(maxY, -rect.y) + 1;
        for (const [c, w] of [[0.08, 0.07], [0.47, 0.13], [0.78, 0.11]]) {
          const x = -a + c * L;
          const half = w * L / 2, bow = w * L * 0.7;
          const band = new Path2D();
          band.moveTo(x - half, -reach);
          band.quadraticCurveTo(x - half + bow, 0, x - half, reach);
          band.lineTo(x + half, reach);
          band.quadraticCurveTo(x + half + bow, 0, x + half, -reach);
          band.closePath();
          ctx.strokeStyle = new RGBA(0.05, 0.04, 0.04).css;
          ctx.lineWidth = 2.2;
          ctx.stroke(band);
          ctx.fillStyle = new RGBA(0.98, 0.98, 0.96).css;
          ctx.fill(band);
        }
        break;
      }
    }
  },

  makeTail(s) {
    const T = s.tailLength, S = s.tailSpread;
    // The root is a little deeper than the peduncle it grows from.
    const root = FishArt.outline(s, -s.length / 2);
    const p = root.top * 1.25, q = root.bottom * 1.25;
    const overlap = 4;
    const size = { w: T * 1.1 + overlap + 4, h: 2 * S * 1.15 + 6 };
    const origin = [size.w - overlap - 1, size.h / 2];

    const path = new Path2D();
    switch (s.tailStyle) {
      case 'forked':
        path.moveTo(overlap, p);
        path.quadraticCurveTo(-T * 0.45, p + S * 0.25, -T, S);
        path.quadraticCurveTo(-T * 0.72, S * 0.3, -T * 0.55, 0);
        path.quadraticCurveTo(-T * 0.72, -S * 0.3, -T, -S);
        path.quadraticCurveTo(-T * 0.45, -q - S * 0.25, overlap, -q);
        break;
      case 'fan':
        path.moveTo(overlap, p);
        path.quadraticCurveTo(-T * 0.4, S * 0.85, -T * 0.8, S);
        path.bezierCurveTo(-T * 1.1, S * 0.6, -T * 1.1, -S * 0.6, -T * 0.8, -S);
        path.quadraticCurveTo(-T * 0.4, -S * 0.85, overlap, -q);
        break;
      case 'shark':
        // A great white's crescent (lunate) tail.
        path.moveTo(overlap, p);
        path.quadraticCurveTo(-T * 0.3, p + S * 0.55, -T, S);
        path.quadraticCurveTo(-T * 0.5, S * 0.3, -T * 0.42, 0);
        path.quadraticCurveTo(-T * 0.5, -S * 0.28, -T * 0.9, -S * 0.85);
        path.quadraticCurveTo(-T * 0.28, -q - S * 0.45, overlap, -q);
        break;
      case 'flowing': {
        path.moveTo(overlap, p);
        path.bezierCurveTo(-T * 0.3, S * 1.1, -T * 0.7, S * 1.12, -T * 0.95, S * 0.9);
        // Scalloped trailing edge.
        const n = 5;
        for (let i = 1; i <= n; i++) {
          const y = S * 0.9 - i * (1.9 * S / n);
          const prevY = y + 1.9 * S / n;
          path.quadraticCurveTo(-T * 1.08, (y + prevY) / 2, -T * (i % 2 === 0 ? 1.0 : 0.9), y);
        }
        path.bezierCurveTo(-T * 0.7, -S * 1.15, -T * 0.3, -S * 1.0, overlap, -q);
        break;
      }
    }
    path.closePath();

    const img = Art.image(size.w, size.h, Art.scale, (ctx) => {
      ctx.translate(origin[0], origin[1]);
      ctx.save();
      ctx.clip(path);
      if (s.shape === 'shark') {
        Art.linear(ctx, [s.top.mix(s.mid, 0.45), s.top.mix(s.mid, 0.6)], null, [0, 0], [-T, 0]);
        ctx.restore();
        return;
      }
      const tipAlpha = s.tailStyle === 'flowing' ? 0.4 : 0.6;
      Art.linear(ctx, [s.fin.darker(0.08), s.fin.lighter(0.2).alpha(s.fin.a * tipAlpha)], null, [0, 0], [-T, 0]);
      ctx.strokeStyle = s.fin.darker(0.35).alpha(0.3).css;
      ctx.lineWidth = 0.55;
      ctx.beginPath();
      for (let k = -6; k <= 6; k++) {
        const f = k / 6;
        ctx.moveTo(overlap, f * (f > 0 ? p : q) * 0.8);
        ctx.quadraticCurveTo(-T * 0.5, f * S * 0.55, -T * 1.05, f * S * 1.05);
      }
      ctx.stroke();
      ctx.restore();
      ctx.strokeStyle = (s.finEdge ?? new RGBA(1, 1, 1, 0.18)).css;
      ctx.lineWidth = s.finEdge ? 1.4 : 0.6;
      ctx.stroke(path);
    });
    // Place the image so its attach point sits just inside the back of the body.
    const attachX = -s.length / 2 + 1;
    return [img, { x: attachX - origin[0], y: -origin[1], w: size.w, h: size.h }];
  },

  makePectoral(s) {
    const size = { w: Math.max(6, s.length * 0.26 * s.pectoralScale), h: Math.max(4, s.length * 0.16 * s.pectoralScale) };
    const img = Art.image(size.w, size.h, Art.scale, (ctx) => {
      const w = size.w, h = size.h;
      const path = new Path2D();
      if (s.shape === 'shark') {
        // Long and sickle-shaped: broad root (right), convex leading edge, pointed tip.
        path.moveTo(w, h * 0.95);
        path.quadraticCurveTo(w * 0.35, h * 0.92, 1, h * 0.04);
        path.quadraticCurveTo(w * 0.6, h * 0.42, w, h * 0.18);
        path.closePath();
      } else {
        path.moveTo(w, h / 2);
        path.quadraticCurveTo(w * 0.4, h, 1, h * 0.35);
        path.quadraticCurveTo(w * 0.35, 0, w, h / 2);
      }
      ctx.clip(path);
      if (s.shape === 'shark') {
        Art.linear(ctx, [s.top, s.mid], null, [0, h], [0, 0]);
        return;
      }
      Art.linear(ctx, [s.fin.lighter(0.1), s.fin.lighter(0.3).alpha(s.fin.a * 0.4)], null, [w, 0], [0, 0]);
    });
    return [img, size];
  },
};
// ---------------------------------------------------------------------------------------------
// Fins (FishFins.swift): dorsal, anal, tail, pectoral and pelvic pairs (plus the tetra's adipose
// fin) share one mesh and one atlas texture. Each vertex carries its fin kind and its distance
// from where the fin joins the body, so the fin shader can move every fin on its own.
// ---------------------------------------------------------------------------------------------

const FinKind = { rigid: 0, median: 1, tail: 2, pectoral: 3, pelvic: 4 };

const FishFins = {
  build(s, art, u) {
    const shark = s.shape === 'shark';
    const flow = FishFins.flowiness(s);
    const L = s.length, a = L / 2;
    const pelvic = FishFins.pelvicImage(s);
    const adipose = s.id === Species.neonTetra.id ? FishFins.adiposeImage(s) : null;
    const [atlas, uv] = FishFins.pack([art.fins, art.tail, art.pectoral, pelvic.image, ...(adipose ? [adipose] : [])]);
    const m = new Mesh();
    const data = FishFins.data;

    // Dorsal and anal fins: the painted sheet through the middle of the body, split at the centre
    // line so each half follows the body's back or belly.
    const fr = art.finsRect;
    for (const top of [true, false]) {
      const half = { x: fr.x, y: top ? 0 : fr.y, w: fr.w, h: top ? fr.y + fr.h : -fr.y };
      const sheet = FishFins.grid(half, fr, uv[0], 18, 8);
      for (let i = 0; i < sheet.count; i++) {
        const p = sheet.pos(i);
        const section = FishBody.section(s, p.x);
        const outline = FishArt.outline(s, p.x);
        const artEdge = top ? outline.top : outline.bottom;
        const shift = top ? section.top - artEdge : artEdge - section.bottom;
        sheet.p[i * 3 + 1] += shift;
        const span = Math.max(0, Math.abs(p.y) - artEdge * 0.95) * u;
        const along = (p.x - fr.x) / fr.w;
        sheet.c.push(...data(shark ? FinKind.rigid : FinKind.median, flow, span, along, fr.w * u));
      }
      m.append(sheet.scaled(u));
    }

    // Tail (the art already fits its root to the tail joint's back and belly heights).
    const tr = art.tailRect;
    const attachX = -a + 1;
    const tail = FishFins.grid(tr, tr, uv[1], 12, 8);
    const spread = Math.max(tr.y + tr.h, -tr.y);
    for (let i = 0; i < tail.count; i++) {
      const p = tail.pos(i);
      const span = clamp((attachX - p.x) / s.tailLength, 0, 1);
      tail.c.push(...data(shark ? FinKind.rigid : FinKind.tail, flow, span, p.y / spread, s.tailLength * u));
    }
    m.append(tail.scaled(u));

    // Pectoral fins: splayed out from the flank and angled down, low on the side of the head.
    const px = L * 0.12;
    const pSec = FishBody.section(s, px);
    const pMid = (pSec.top - pSec.bottom) / 2, pHalf = (pSec.top + pSec.bottom) / 2;
    // A shark's are stiff wings: laid nearly flat, swept back, low on the flank.
    m.append(FishFins.pair(art.pectoralSize, uv[2], shark ? FinKind.rigid : FinKind.pectoral, 0,
      v3(px, pMid - pHalf * (shark ? 0.5 : 0.24), pSec.halfWidth * (shark ? 0.8 : 0.9)),
      shark ? 1.15 : 0.55, shark ? 0.4 : 0.35, shark ? 1.35 : 0, u));

    // Pelvic fins, on the belly.
    const vx = a - pelvic.fromNose * L;
    const vSec = FishBody.section(s, vx);
    m.append(FishFins.pair(pelvic.size, uv[3], shark ? FinKind.rigid : FinKind.pelvic, pelvic.flow,
      v3(vx, -vSec.bottom * 0.88, vSec.halfWidth * 0.42), pelvic.splay, pelvic.droop, 0, u));

    // The neon tetra's adipose fin: a little fleshy lobe on the back, behind the dorsal fin.
    if (adipose) {
      const w = adipose.width / Art.scale, h = adipose.height / Art.scale;
      const x = -a + 0.15 * L;
      const base = FishBody.section(s, x).top - h * 0.3;
      const r = { x: x - w / 2, y: base, w, h };
      const lobe = FishFins.grid(r, r, uv[4], 3, 2);
      for (let i = 0; i < lobe.count; i++) {
        const p = lobe.pos(i);
        lobe.c.push(...data(FinKind.median, 0.3, Math.max(0, p.y - base - h * 0.3) * u, (p.x - r.x) / w, w * u));
      }
      m.append(lobe.scaled(u));
    }

    const texture = Art.texture(atlas, { premultiplied: true });
    return { geometry: m.geometry('aFin'), texture, solid: shark };
  },

  /** How loosely a species' fins flow (0 = stiff ... 1 = long and billowing, like a betta's). */
  flowiness(s) {
    if (s.shape === 'shark') return 0;
    const finHeight = Math.max(s.dorsal.height, s.anal.height) / s.length;
    const tail = s.tailStyle === 'flowing' ? s.tailLength / s.length : 0;
    return Math.min(1, 0.1 + finHeight * 0.55 + tail * 0.7);
  },

  /** Pelvic fins: where they sit (fraction of body length behind the nose), how they hang, and
   *  how they look. Angelfish trail long threads; a betta's hang like ribbons. */
  pelvicImage(s) {
    const L = s.length;
    if (s.id === Species.angelfish.id) {
      const size = { w: L * 1.05, h: 3.2 };
      const image = Art.image(size.w, size.h, Art.scale, (ctx) => {
        const path = new Path2D();
        path.moveTo(size.w, 0.2);
        path.quadraticCurveTo(size.w * 0.4, 0.6, 0, 1.3);
        path.quadraticCurveTo(size.w * 0.4, 2.2, size.w, 3.0);
        path.closePath();
        ctx.clip(path);
        // Pale threads with a dark band near the root, like the body's stripes.
        Art.linear(ctx, [new RGBA(0.1, 0.1, 0.1, 0.8), new RGBA(0.1, 0.1, 0.1, 0.8), s.fin.lighter(0.3).alpha(0.7),
          s.fin.lighter(0.5).alpha(0.35)], [0, 0.12, 0.2, 1], [size.w, 0], [0, 0]);
      });
      return { image, size, fromNose: 0.34, splay: 0.12, droop: 1.0, flow: 0.9 };
    }
    if (s.id === Species.betta.id) {
      const size = { w: L * 0.62, h: L * 0.15 };
      const image = Art.image(size.w, size.h, Art.scale, (ctx) => {
        const w = size.w, h = size.h;
        const path = new Path2D();
        path.moveTo(w, h * 0.25);
        path.quadraticCurveTo(w * 0.35, -h * 0.1, 0, h * 0.3);
        path.quadraticCurveTo(w * 0.45, h * 1.1, w, h * 0.8);
        path.closePath();
        FishFins.paint(ctx, path, s, size);
      });
      return { image, size, fromNose: 0.32, splay: 0.2, droop: 0.95, flow: 1 };
    }
    const shark = s.shape === 'shark';
    const size = { w: Math.max(5, L * (shark ? 0.13 : 0.17)), h: Math.max(3, L * (shark ? 0.08 : 0.075)) };
    const image = Art.image(size.w, size.h, Art.scale, (ctx) => {
      const w = size.w, h = size.h;
      const path = new Path2D();
      path.moveTo(w, h * 0.15);
      path.quadraticCurveTo(w * 0.45, 0, 1, h * 0.3);
      path.quadraticCurveTo(w * 0.4, h, w, h * 0.9);
      path.closePath();
      FishFins.paint(ctx, path, s, size);
    });
    const fromNose = shark ? 0.64 : (s.id === Species.clownfish.id ? 0.38 : 0.5);
    return { image, size, fromNose, splay: shark ? 0.6 : 0.3, droop: shark ? 0.45 : 0.6, flow: 0.15 };
  },

  adiposeImage(s) {
    const w = s.length * 0.12, h = s.height * 0.3;
    return Art.image(w, h, Art.scale, (ctx) => {
      const path = new Path2D();
      path.moveTo(w, 0);
      path.quadraticCurveTo(w * 0.8, h * 1.05, w * 0.25, h * 0.9);
      path.quadraticCurveTo(0, h * 0.6, 0, 0);
      path.closePath();
      ctx.clip(path);
      Art.linear(ctx, [s.fin.alpha(0.7), s.fin.lighter(0.3).alpha(0.4)], null, [0, 0], [0, h]);
    });
  },

  /** Fill a paired fin shape: solid like the body for the shark, else translucent with rays. */
  paint(ctx, path, s, size) {
    ctx.clip(path);
    const w = size.w, h = size.h;
    if (s.shape === 'shark') {
      Art.linear(ctx, [s.top, s.mid], null, [0, h], [0, 0]);
      return;
    }
    Art.linear(ctx, [s.fin.lighter(0.05), s.fin.lighter(0.3).alpha(s.fin.a * 0.45)], null, [w, 0], [0, 0]);
    ctx.strokeStyle = s.fin.darker(0.35).alpha(0.3).css;
    ctx.lineWidth = 0.45;
    ctx.beginPath();
    for (let k = 0; k <= 5; k++) {
      const f = k / 5;
      ctx.moveTo(w, h * (0.2 + 0.6 * f));
      ctx.lineTo(0, h * (0.1 + 0.8 * f));
    }
    ctx.stroke();
  },

  /** A paired fin on both sides. The image's right edge is the root; the fin is swung back and out
   *  by `splay`, then angled down by `droop`. `root` is the right-hand root in species points. */
  pair(size, uv, kind, flow, root, splay, droop, roll, u) {
    const r = { x: -size.w, y: -size.h / 2, w: size.w, h: size.h };
    const fin = FishFins.grid(r, r, uv, kind === FinKind.pelvic && flow > 0.5 ? 12 : 4, 1);
    const both = new Mesh();
    for (const side of [1, -1]) {
      // `roll` turns the fin about its own span first, laying it flat like a wing.
      const q = quatAxis(side * splay, 0, 1, 0).multiply(quatAxis(droop, 0, 0, 1)).multiply(quatAxis(side * roll, 1, 0, 0));
      const tip = v3(-1, 0, 0).applyQuaternion(q);
      const piece = fin.scaled(u);
      piece.c = [];
      for (let i = 0; i < fin.count; i++) piece.c.push(...FishFins.data(kind, flow, side * (-fin.p[i * 3] * u + 1e-6), tip.x, tip.y));
      both.append(piece, mat4Translate(v3(root.x, root.y, root.z * side).multiplyScalar(u)).multiply(mat4Rotate(q)));
    }
    return both;
  },

  /** A flat grid over `r` (species points, normal +z) textured from the part of the atlas at `uv`,
   *  where `image` is the rectangle the whole image covers. */
  grid(r, image, uv, columns, rows) {
    const m = new Mesh();
    for (let j = 0; j <= rows; j++) {
      for (let i = 0; i <= columns; i++) {
        const x = r.x + r.w * i / columns;
        const y = r.y + r.h * j / rows;
        m.p.push(x, y, 0);
        m.n.push(0, 0, 1);
        const fu = (x - image.x) / image.w, fv = (y - image.y) / image.h;
        m.uv.push(uv.x + fu * uv.w, uv.y + (1 - fv) * uv.h);
      }
    }
    for (let j = 0; j < rows; j++) {
      for (let i = 0; i < columns; i++) {
        const q = j * (columns + 1) + i, c = q + columns + 1;
        m.triangle(q, q + 1, c);
        m.triangle(q + 1, c + 1, c);
      }
    }
    return m;
  },

  /** Per-vertex fin data for the shader: (kind + flow / 2, span, a, b). */
  data(kind, flow, span, a, b) {
    return [kind + clamp(flow, 0, 0.999) / 2, span, a, b];
  },

  /** Stack images vertically (2px gaps) into one atlas; returns each one's UV rect (top-left origin). */
  pack(parts) {
    const w = Math.max(...parts.map((p) => p.width));
    const h = parts.reduce((t, p) => t + p.height, 0) + 2 * parts.length;
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    const ctx = c.getContext('2d');
    const rects = [];
    let top = 0;
    for (const img of parts) {
      ctx.drawImage(img, 0, top);
      rects.push({ x: 0, y: top / h, w: img.width / w, h: img.height / h });
      top += img.height + 2;
    }
    return [c, rects];
  },
};

// ---------------------------------------------------------------------------------------------
// Eyes (FishEyes.swift EyeModel): one eyeball mesh looking along +z with a slight corneal bulge,
// a painted iris, and where each eye sits on the head
// ---------------------------------------------------------------------------------------------

const EyeModel = {
  make(s, u) {
    const isShark = s.shape === 'shark';
    const ex = s.length / 2 - 0.17 * s.length;
    const section = FishBody.section(s, ex);
    const er = Math.max(1.9, Math.min(s.length * 0.075, s.height / 2 * 0.34)) * s.eyeScale;
    // A little above the middle of the head, sunk into the flank so a domed cap shows.
    const mid = (section.top - section.bottom) / 2;
    const half = (section.top + section.bottom) / 2;
    const ey = mid + 0.3 * half;
    const rel = (ey - mid) / Math.max(half, 1e-3);
    const surface = section.halfWidth * Math.sqrt(1 - rel * rel);
    const ez = Math.max(surface - 0.4 * er, 0.5 * er);

    const sockets = [1, -1].map((side) => {
      const n = v3(0.3, 0.08, side).normalize();
      const fore = v3(1, 0, 0).sub(n.clone().multiplyScalar(n.x)).normalize();
      const c = n.clone().cross(fore);
      const up = c.multiplyScalar(c.y >= 0 ? 1 : -1);
      return { center: v3(ex, ey, ez * side).multiplyScalar(u), neutral: n, fore, up, base: quatFromTo(v3(0, 0, 1), n) };
    });

    // Unit eyeball looking along +z. The iris is projected straight on from the front.
    const sphere = Mesh.icosphere(3);
    for (let i = 0; i < sphere.count; i++) {
      const p = sphere.pos(i);
      let x = p.x, y = p.y;
      if (p.z <= 0) { const l = Math.hypot(x + 1e-4, y) || 1; x = (x + 1e-4) / l; y = y / l; }
      sphere.uv.push(0.5 + x * 0.5, 0.5 - y * 0.5);
    }
    // The cornea bulges a little over the iris.
    sphere.mapPositions((p) => {
      const t = clamp((p.z - 0.55) / 0.45, 0, 1);
      return p.multiplyScalar(1 + 0.14 * t * t * (3 - 2 * t));
    });
    sphere.computeNormals();

    const material = new THREE.MeshPhysicalMaterial({
      map: Art.texture(EyeModel.iris(s)),
      roughness: isShark ? 0.25 : 0.4,
      metalness: 0,
      // A wet, glassy cornea over the matte iris.
      clearcoat: 1,
      clearcoatRoughness: 0.03,
    });
    return { geometry: sphere.geometry(), material, x: ex * u, radius: er * u, sockets, reach: isShark ? 0.3 : 0.55 };
  },

  /** The front of the eye: black pupil, coloured iris with radial fibres, bright rings. */
  iris(s) {
    const isShark = s.shape === 'shark';
    const size = 64, c = [32, 32], r = 32;
    const iris = r * 0.8, pupil = r * (isShark ? 0.5 : 0.42);
    const warm = s.eye.r >= s.eye.b;
    const ring = isShark ? new RGBA(0.16, 0.18, 0.17) : (warm ? new RGBA(0.95, 0.78, 0.38) : new RGBA(0.86, 0.90, 0.92));
    // Beyond the iris the eyeball is mostly hidden in the head; tint it like the skin around it.
    const rim = isShark ? s.top.darker(0.5) : s.mid.darker(0.55);
    return Art.image(size, size, 1, (ctx) => {
      ctx.fillStyle = rim.css;
      ctx.fillRect(0, 0, size, size);
      const base = isShark ? new RGBA(0.07, 0.08, 0.08) : s.eye;
      Art.radial(ctx, [base.lighter(0.1), base.darker(0.25), base.darker(0.65)], [0.45, 0.7, 1], c, iris);
      ctx.save();
      ctx.beginPath(); ctx.arc(c[0], c[1], iris, 0, TAU); ctx.clip();
      ctx.lineCap = 'round';
      for (let i = 0; i < 70; i++) {
        const a = i / 70 * TAU + rnd(-0.03, 0.03);
        const r0 = pupil + rnd(0, 2), r1 = iris * rnd(0.7, 1);
        const light = coin();
        ctx.strokeStyle = (light ? base.lighter(0.45) : base.darker(0.55)).alpha(rnd(0.15, 0.45)).css;
        ctx.lineWidth = rnd(0.6, 1.4);
        ctx.beginPath();
        ctx.moveTo(c[0] + Math.cos(a) * r0, c[1] + Math.sin(a) * r0);
        ctx.lineTo(c[0] + Math.cos(a) * r1, c[1] + Math.sin(a) * r1);
        ctx.stroke();
      }
      ctx.restore();
      // Limbal ring and pupillary ring.
      ctx.strokeStyle = ring.alpha(isShark ? 0.6 : 0.9).css;
      ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.arc(c[0], c[1], iris - 1, 0, TAU); ctx.stroke();
      if (!isShark) {
        ctx.strokeStyle = ring.lighter(0.3).css;
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(c[0], c[1], pupil + 1.2, 0, TAU); ctx.stroke();
      }
      Art.radial(ctx, [new RGBA(0.02, 0.03, 0.05), new RGBA(0.005, 0.005, 0.01)], null, c, pupil);
    });
  },
};

// ---------------------------------------------------------------------------------------------
// The shark's articulated mouth (SharkJaw.swift): a lower jaw cut from the underside of the head
// that swings open on a hinge, a dark mouth interior, and rows of teeth on both jaws
// ---------------------------------------------------------------------------------------------

const SharkJaw = {
  backFraction: 0.27,
  frontFraction: 0.045,
  spread: 1.05,
  palette: [new RGBA(0.94, 0.94, 0.92), new RGBA(0.28, 0.05, 0.07), new RGBA(0.55, 0.20, 0.22),
    new RGBA(0.97, 0.96, 0.91), new RGBA(0.42, 0.45, 0.49)],

  /** `section(x)` gives the body's belly depth (hy) and half-width (hz) at x (species points). */
  make(s, u, section) {
    const Tone = { skin: 0, mouth: 1, gum: 2, tooth: 3, lip: 4 };
    const a = s.length / 2, L = s.length;
    const xh = a - SharkJaw.backFraction * L, xf = a - SharkJaw.frontFraction * L;
    const phi = SharkJaw.spread;
    const nx = 12, na = 14;
    const uv = (t) => Art.paletteUV(t, SharkJaw.palette.length);
    const point = (x, th, scale) => {
      const { hy, hz } = section(x);
      return v3(x, hy * Math.cos(th) * scale, hz * Math.sin(th) * scale);
    };
    const xAt = (i) => xh + (xf - xh) * i / nx;
    const thAt = (j) => Math.PI - phi + 2 * phi * j / na;

    // Jaw shell: outer skin just outside the body, dark inner surface, lips joining them.
    let shell = new Mesh();
    const grid = (scale, tone, flip) => {
      const base = shell.count;
      for (let i = 0; i <= nx; i++) {
        for (let j = 0; j <= na; j++) {
          shell.addPos(point(xAt(i), thAt(j), scale));
          shell.addUV(uv(tone));
        }
      }
      for (let i = 0; i < nx; i++) {
        for (let j = 0; j < na; j++) {
          const a0 = base + i * (na + 1) + j, b0 = a0 + 1, c0 = a0 + na + 1, d0 = c0 + 1;
          if (flip) shell.quad(b0, a0, d0, c0); else shell.quad(a0, b0, c0, d0);
        }
      }
    };
    grid(1.02, Tone.skin, false);
    grid(0.95, Tone.mouth, true);
    const jawShell = shell;
    shell = new Mesh();
    grid(1.008, Tone.mouth, false);
    const palate = shell;
    shell = jawShell;
    const lip = (edge) => {
      const base = shell.count;
      for (const [x, th] of edge) {
        shell.addPos(point(x, th, 1.02)); shell.addPos(point(x, th, 0.95));
        shell.addUV(uv(Tone.lip)); shell.addUV(uv(Tone.gum));
      }
      for (let k = 0; k < edge.length - 1; k++) shell.quad(base + k * 2, base + k * 2 + 1, base + k * 2 + 2, base + k * 2 + 3);
    };
    const range = (n) => Array.from({ length: n + 1 }, (_, i) => i);
    lip(range(nx).map((i) => [xAt(i), thAt(0)]));
    lip(range(nx).map((i) => [xAt(i), thAt(na)]));
    lip(range(na).map((j) => [xf, thAt(j)]));

    // Teeth along the rims: upward on the lower jaw, downward from the upper jaw line.
    const lower = new Mesh(), upper = new Mesh();
    const toothLength = L * 0.03, toothWidth = L * 0.0075;
    const rim = [];
    const sideCount = 9, frontCount = 8;
    for (let k = 0; k < sideCount; k++) {
      const x = xh + (xf - xh) * (0.25 + 0.75 * k / (sideCount - 1));
      rim.push([x, thAt(0)], [x, thAt(na)]);
    }
    for (let k = 1; k < frontCount; k++) rim.push([xf - L * 0.004, thAt(0) + (thAt(na) - thAt(0)) * k / frontCount]);
    for (const [x, th] of rim) {
      const inward = v3(0, -Math.cos(th), -Math.sin(th));
      const jitter = rnd(0.8, 1.15);
      lower.append(SharkJaw.tooth(point(x, th, 0.97), v3(0, 0.8, 0).add(inward.clone().multiplyScalar(0.4)).normalize(),
        toothLength * jitter, toothWidth, uv(Tone.tooth)));
      upper.append(SharkJaw.tooth(point(x - L * 0.006, th, 0.99), v3(0, -0.85, 0).add(inward.clone().multiplyScalar(0.3)).normalize(),
        toothLength * 1.1 * jitter, toothWidth, uv(Tone.tooth)));
    }

    const tex = Art.texture(Art.palette(SharkJaw.palette), { nearest: true, mipmaps: false });
    const material = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.7, metalness: 0, side: THREE.DoubleSide });
    const finish = (m) => {
      const g = m.scaled(u);
      g.computeNormals();
      return g.geometry();
    };
    return {
      shell: finish(shell), lowerTeeth: finish(lower), upperTeeth: finish(upper), palate: finish(palate), material,
      hinge: v3(xh, -section(xh).hy * 0.2, 0).multiplyScalar(u),
      midX: (xh + xf) / 2 * u,
    };
  },

  /** A small triangular pyramid. */
  tooth(p, dir, length, width, uv) {
    const side = Math.abs(dir.x) < 0.9 ? dir.clone().cross(v3(1, 0, 0)).normalize() : dir.clone().cross(v3(0, 1, 0)).normalize();
    const up = side.clone().cross(dir);
    const m = new Mesh();
    for (let k = 0; k < 3; k++) {
      const a = k / 3 * TAU;
      m.addPos(p.clone().add(side.clone().multiplyScalar(Math.cos(a) * width)).add(up.clone().multiplyScalar(Math.sin(a) * width)));
    }
    m.addPos(p.clone().add(dir.clone().multiplyScalar(length)));
    for (let k = 0; k < 4; k++) m.addUV(uv);
    m.triangle(0, 1, 3);
    m.triangle(1, 2, 3);
    m.triangle(2, 0, 3);
    return m;
  },
};

// ---------------------------------------------------------------------------------------------
// Body materials (FishMaterials.swift): the painted skin plus each fish's own colour and the
// angle-dependent sheen of real scales
// ---------------------------------------------------------------------------------------------

const FishMaterials = {
  /** How a species' scales play with the light: (mask, swing, glow, sparkle). */
  sheen(s) {
    switch (s.id) {
      case Species.neonTetra.id: return [1, 0.7, 0.6, 0];
      case Species.betta.id: return [2, 0.55, 0.35, 0.12];
      case Species.goldfish.id: return [2, 0.06, 0.1, 0.3];
      case Species.angelfish.id: return [2, 0.04, 0.05, 0.12];
      default: return [0, 0, 0, 0];
    }
  },

  /** A body material for one fish, with its own uniforms `u`. */
  body(model, u) {
    const s = model.species;
    const mat = new THREE.MeshStandardMaterial({
      map: model.skinTexture,
      roughness: s.roughness ?? (s.pattern === 'metallic' ? 0.3 : 0.4),
      metalness: s.shape === 'shark' ? 0 : (s.pattern === 'metallic' ? 0.35 : 0.08),
      normalMap: model.scalesTexture,
    });
    const k = s.pattern === 'metallic' ? 0.8 : (s.shape === 'shark' ? 0.12 : 0.5);
    mat.normalScale.set(k, -k);
    return patchMaterial(mat, {
      key: 'fish-body',
      uniforms: { ...causticUniforms(), fishCaustic: G.fishCaustic, ...u },
      vHead: FISH_BODY_HEAD,
      vMain: 'fishBody(gPos, gNrm);',
      fHead: FISH_SKIN_HEAD,
      fAfterEmissive: FISH_SKIN,
    });
  },

  bodyDepth(u) {
    return patchedDepthMaterial({ key: 'fish-body', uniforms: { uTime: G.uTime, ...u }, vHead: FISH_BODY_HEAD, vMain: 'fishBody(gPos, gNrm);' });
  },

  /** Fins are translucent, glowing where light shines through them, except a shark's, which are
   *  solid and matte (cut out and drawn opaque). */
  fins(model, u) {
    const solid = model.fins.solid;
    const mat = new THREE.MeshStandardMaterial({
      map: model.fins.texture,
      roughness: solid ? 0.85 : 0.5,
      metalness: 0,
      side: THREE.DoubleSide,
