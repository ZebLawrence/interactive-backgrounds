<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Firefly Meadow</title>
<meta name="description" content="An interactive 3D meadow at night: grass parts around the cursor, fireflies scatter from a fast one, gather round a resting one and fall into step, and a clap sends them all flashing.">
<meta name="theme-color" content="#060a14">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A8%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="meadow"></canvas>
<div id="ui">
  <button id="menuBtn" aria-label="Firefly Meadow menu" aria-expanded="false" title="Firefly Meadow">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5c.4 0 .7.3.8.6l1.3 4.1 4.2.1c.7 0 1 .9.5 1.3l-3.4 2.6 1.2 4.1c.2.7-.6 1.2-1.1.8L12 13.7l-3.5 2.4c-.5.4-1.3-.1-1.1-.8l1.2-4.1-3.4-2.6c-.5-.4-.2-1.3.5-1.3l4.2-.1 1.3-4.1c.1-.3.4-.6.8-.6Z"/></svg>
  </button>
  <div id="menu" hidden role="menu">
    <div class="hdr" id="menuTitle">Firefly Meadow</div>
    <hr>
    <button data-act="clap"><span class="check"></span><span class="label">Clap</span><kbd>C</kbd></button>
    <button data-act="density"><span class="check">▸</span><span class="label">Fireflies</span></button>
    <div id="density" hidden>
      <button data-density="few"><span class="check"></span><span class="label">A few</span></button>
      <button data-density="normal"><span class="check"></span><span class="label">A meadow full</span></button>
      <button data-density="many"><span class="check"></span><span class="label">A swarm</span></button>
    </div>
    <button data-act="reseed"><span class="check"></span><span class="label">New Meadow</span></button>
    <hr>
    <button data-toggle="moonlight"><span class="check"></span><span class="label">Moonlight</span><kbd>M</kbd></button>
    <button data-toggle="storm"><span class="check"></span><span class="label">Storm</span><kbd>S</kbd></button>
    <button data-toggle="clickToClap"><span class="check"></span><span class="label">Click to Clap</span></button>
    <button data-toggle="lowPower"><span class="check"></span><span class="label">Low Power (30 fps)</span></button>
    <hr>
    <button data-act="fullscreen"><span class="check"></span><span class="label">Full Screen</span></button>
  </div>
</div>
<div id="hint">Move fast and the fireflies scatter · rest the cursor and they gather and fall into step · click to clap</div>
<div id="error" hidden></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
